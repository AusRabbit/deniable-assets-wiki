<style>
  :root{
    --bg:#EDEFF2; --surface:#FFFFFF; --surface-2:#F5F7F9;
    --ink:#191D23; --muted:#59636F; --line:#D6DBE1;
    --amber:#A66A12; --amber-soft:#F0E2CA;
    --teal:#1B6B67; --teal-soft:#D9EAE8;
    --rust:#9C3B2E; --rust-soft:#F2DFDB;
    --display:"Zilla Slab",Georgia,serif;
    --body:"Source Sans 3",system-ui,-apple-system,sans-serif;

    --sp:clamp(16px,3vw,28px);
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#13161A; --surface:#1B1F25; --surface-2:#22272E;
      --ink:#E4E8ED; --muted:#939DA9; --line:#2E353E;
      --amber:#DFA244; --amber-soft:#3A2F1C;
      --teal:#56B4AD; --teal-soft:#16302F;
      --rust:#D4776A; --rust-soft:#3A221E;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#13161A; --surface:#1B1F25; --surface-2:#22272E;
    --ink:#E4E8ED; --muted:#939DA9; --line:#2E353E;
    --amber:#DFA244; --amber-soft:#3A2F1C;
    --teal:#56B4AD; --teal-soft:#16302F;
    --rust:#D4776A; --rust-soft:#3A221E;
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--body); font-size:16px; line-height:1.6;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  img{max-width:100%}
  a{color:inherit}
  h1,h2,h3{font-family:var(--display); text-wrap:balance; margin:0; font-weight:600}
  code{font-family:var(--mono); font-size:.92em; background:var(--surface-2); padding:1px 5px; border-radius:3px}

  .shell{display:grid; grid-template-columns:270px minmax(0,1fr)}
  @media (max-width:820px){ .shell{grid-template-columns:minmax(0,1fr)} }

  .rail{
    border-right:1px solid var(--line); background:var(--surface);
    padding:var(--sp) 0 48px; position:sticky; top:env(safe-area-inset-top,0px);
    align-self:start; min-height:100vh; max-height:100vh; overflow-y:auto;
  }
  @media (max-width:820px){
    .rail{position:static; min-height:0; max-height:none; border-right:0; border-bottom:1px solid var(--line); padding-bottom:20px}
  }
  .brand{padding:0 20px 18px; border-bottom:1px solid var(--line); margin-bottom:14px}
  .brand .ship{font-family:var(--display); font-size:21px; font-weight:700; line-height:1.15; letter-spacing:-.01em}
  .brand .sub{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-top:7px}

  .search{margin:0 20px 16px}
  .search input{
    width:100%; padding:8px 11px; border-radius:7px; font-family:var(--body); font-size:14px;
    border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
  }
  .search input:focus{outline:2px solid var(--amber); outline-offset:1px}

  .grp{margin-bottom:16px}
  .grp > .lbl{font-family:var(--mono); font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); padding:0 20px; margin-bottom:5px}
  .nav a{display:flex; align-items:baseline; gap:8px; justify-content:space-between; padding:5px 20px; text-decoration:none; font-size:14.5px; border-left:2px solid transparent}
  .nav a:hover{background:var(--surface-2)}
  .nav a[aria-current="page"]{border-left-color:var(--amber); background:var(--surface-2); font-weight:600}
  .nav a:focus-visible{outline:2px solid var(--amber); outline-offset:-2px}
  .nav a .n{font-family:var(--mono); font-size:10.5px; color:var(--muted)}

  main{padding:var(--sp); padding-block:calc(var(--sp) + 6px) 90px; max-width:820px}
  .crumb{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:10px}
  .ttl{font-size:clamp(28px,5vw,40px); line-height:1.08; letter-spacing:-.02em; margin-bottom:6px}
  .dek{color:var(--muted); font-size:17px; margin-bottom:22px}

  .badges{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:20px}
  .tag{font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; padding:3px 8px; border-radius:4px; background:var(--surface-2); color:var(--muted); border:1px solid var(--line)}
  .tag.t-character{background:var(--teal-soft); color:var(--teal); border-color:transparent}
  .tag.t-place{background:var(--amber-soft); color:var(--amber); border-color:transparent}
  .tag.t-ship{background:var(--amber-soft); color:var(--amber); border-color:transparent}
  .tag.t-faction{background:var(--rust-soft); color:var(--rust); border-color:transparent}
  .conf{display:inline-flex; align-items:center; gap:5px}
  .dot{width:7px; height:7px; border-radius:50%; display:inline-block}
  .dot.hi{background:var(--teal)} .dot.mid{background:var(--amber)} .dot.lo{background:var(--rust)}

  .prose p{margin:0 0 15px}
  .prose h2{font-size:15px; letter-spacing:.02em; margin:30px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--line)}
  .prose ul{margin:0 0 16px; padding-left:20px}
  .prose li{margin-bottom:7px}
  .prose em{color:var(--muted)}

  a.wl{color:var(--teal); text-decoration:none; border-bottom:1px solid color-mix(in srgb, var(--teal) 35%, transparent); padding-bottom:.5px}
  a.wl:hover{border-bottom-color:var(--teal); background:var(--teal-soft)}
  a.wl.missing{color:var(--rust); border-bottom-style:dotted; border-bottom-color:var(--rust)}

  .panel{border:1px solid var(--line); border-radius:9px; background:var(--surface); padding:16px 18px; margin:0 0 18px}
  .panel .ph{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:9px}
  .panel p{margin:0}
  .panel.note{background:var(--surface-2)}
  .panel.warn{border-left:3px solid var(--rust)}

  .alias{display:inline-block; font-family:var(--mono); font-size:11.5px; padding:2px 7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); margin:0 4px 4px 0; color:var(--muted)}

  .backlinks{margin-top:34px; padding-top:16px; border-top:1px solid var(--line)}
  .backlinks .ph{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:8px}
  .backlinks ul{list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:6px}
  .backlinks li a{font-size:13.5px; text-decoration:none; padding:3px 9px; border-radius:5px; background:var(--surface-2); border:1px solid var(--line)}
  .backlinks li a:hover{border-color:var(--teal); color:var(--teal)}

  .thread{border-left:2px solid var(--line); padding:0 0 2px 15px; margin-bottom:20px}
  .thread.open{border-left-color:var(--amber)}
  .thread.hot{border-left-color:var(--rust)}
  .thread h3{font-size:16.5px; margin-bottom:3px}
  .thread .st{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:5px}
  .thread p{margin:0; font-size:15px}

  .beat{display:grid; grid-template-columns:70px minmax(0,1fr); gap:14px; margin-bottom:16px}
  @media (max-width:520px){ .beat{grid-template-columns:minmax(0,1fr); gap:2px} }
  .beat .t{font-family:var(--mono); font-size:11.5px; color:var(--muted); padding-top:4px}
  .beat .b p{margin:2px 0 0; font-size:14.5px; color:var(--muted)}

  .talent-controls{display:grid; grid-template-columns:minmax(180px,2fr) repeat(3,minmax(120px,1fr)); gap:10px; margin:0 0 12px}
  .talent-controls input,.talent-controls select{width:100%; min-width:0; padding:8px 10px; border:1px solid var(--line); border-radius:7px; background:var(--surface); color:var(--ink); font:14px var(--body)}
  .talent-controls input:focus,.talent-controls select:focus{outline:2px solid var(--amber); outline-offset:1px}
  .talent-summary{font:11px var(--mono); color:var(--muted); margin-bottom:14px}
  .talent-list{display:grid; gap:10px}
  .talent-card{border:1px solid var(--line); border-radius:9px; background:var(--surface); padding:14px 16px}
  .talent-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:5px}
  .talent-head h2{font-size:18px; line-height:1.2; border:0; padding:0; margin:0}
  .talent-tier{flex:none; font:10.5px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--amber); background:var(--amber-soft); border-radius:4px; padding:3px 7px}
  .talent-meta{font:10.5px var(--mono); color:var(--muted); margin-bottom:8px}
  .talent-card p{margin:0 0 8px}
  .talent-source{font-size:12.5px; color:var(--muted)}
  .talent-note{font-size:12.5px; color:var(--rust); margin-top:7px}
  .talent-empty{border:1px dashed var(--line); border-radius:9px; color:var(--muted); padding:22px; text-align:center}
  @media (max-width:720px){.talent-controls{grid-template-columns:1fr 1fr}.talent-controls input{grid-column:1/-1}}
  @media (max-width:460px){.talent-controls{grid-template-columns:1fr}.talent-controls input{grid-column:auto}}

  .foot{margin-top:44px; padding-top:16px; border-top:1px solid var(--line); font-size:13px; color:var(--muted)}

  .themebtn{
    position:fixed; right:14px; bottom:calc(14px + env(safe-area-inset-bottom,0px));
    border:1px solid var(--line); background:var(--surface); color:var(--muted);
    font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
    padding:7px 11px; border-radius:6px; cursor:pointer;
  }
  .themebtn:hover{color:var(--ink); border-color:var(--amber)}
  @media (prefers-reduced-motion:no-preference){ .nav a,a.wl,.backlinks li a{transition:background .12s,color .12s,border-color .12s} }
</style>

<script>
const PAGES  = [{"id": "overview", "title": "Deniable Assets", "group": "Campaign", "type": "doc", "typeLabel": "Session", "layout": "prose", "dek": "Four operatives, one damaged freighter, and an Imperial Moff nobody invited aboard.", "conf": "", "confLabel": "", "player": "", "aliases": [], "aka": [], "html": "<p>The crew began as transport and support for <a class=\"wl\" href=\"#vega-squad\">Vega Squad</a> on an operation against <a class=\"wl\" href=\"#imperial-moff\">an Imperial Moff</a>. A stolen case of liquor, an improvised medical cover story and a firefight later, they escaped with the target alive — and left Vega behind.</p><h2>Current Situation</h2><p>At the end of <a class=\"wl\" href=\"#session-1\">Session 1 — Medical Professionals Coming Through</a>, the <a class=\"wl\" href=\"#mynocks-mullet\">Mynock's Mullet</a> has escaped the <a class=\"wl\" href=\"#luxury-spaceport\">the spaceport</a> with damaged landing gear. The Moff is aboard, Kryss is injured, and <a class=\"wl\" href=\"#axel\">Axel</a> is furious. The next destination and the prisoner's handover have not been established. See <a class=\"wl\" href=\"#threads\">Open Threads</a> for the unfinished business.</p><h2>The Crew</h2><ul><li><a class=\"wl\" href=\"#kryss-dorn\">Kryss</a> — Human bounty hunter and assassin. The marksman.</li><li><a class=\"wl\" href=\"#voshkar\">Voshkar</a> — Ewok enforcer. The one who stands in the doorway.</li><li><a class=\"wl\" href=\"#nira-dathwen\">Nira</a> — Bothan doctor and social operator, with credentials that expired a while ago.</li><li><a class=\"wl\" href=\"#tivik-ordo\">Tivik</a> — Duros slicer and demolitions tech, wanted by both sides for his holonet habits.</li></ul><h2>The Ship</h2><p>The <a class=\"wl\" href=\"#mynocks-mullet\">Mynock's Mullet</a>, a battered light freighter with mismatched plating and a scrubbed registry — one of thousands like it in the Outer Rim.</p><h2>Both Sides of the War</h2><p>Every member of the crew is tangled up with both the <a class=\"wl\" href=\"#galactic-empire\">Empire</a> and the <a class=\"wl\" href=\"#rebel-alliance\">Alliance</a>. <a class=\"wl\" href=\"#kryss-dorn\">Kryss</a> keeps applying to the Rebels and keeps getting an Imperial offer instead. <a class=\"wl\" href=\"#voshkar\">Voshkar</a> trains clients from both. <a class=\"wl\" href=\"#tivik-ordo\">Tivik</a> is on both sides' watchlists and is blackmailing officials in each. <a class=\"wl\" href=\"#nira-dathwen\">Nira</a> can no longer practise in the Core Worlds at all. See <a class=\"wl\" href=\"#threads\">Open Threads</a>.</p><h2>How We Play</h2><ul><li>Players roll all of their own characters' checks. The GM rolls NPC checks openly and never rolls for a player character.</li><li>The difficulty of a check is stated before you roll, and it depends on the actual stakes rather than a fixed default.</li><li>Declare what you want to do in your own words. There's no numbered menu of options.</li><li>Initiative slots aren't assigned to specific characters; anyone eligible on that side can take one.</li></ul>", "backlinks": [], "search": "deniable assets four operatives, one damaged freighter, and an imperial moff nobody invited aboard."}, {"id": "timeline", "title": "Campaign Timeline", "group": "Campaign", "type": "doc", "typeLabel": "Session", "layout": "timeline", "dek": "From support detail to an improvised Moff extraction.", "conf": "", "confLabel": "", "player": "", "aliases": [], "aka": [], "html": "<h2>Session 1</h2><div class=\"beat\"><div class=\"t\">M01</div><div class=\"b\"><strong>A stylish arrival</strong><p><a class=\"wl\" href=\"#kryss-dorn\">Kryss</a> lands the <a class=\"wl\" href=\"#mynocks-mullet\">Mynock's Mullet</a> at the <a class=\"wl\" href=\"#luxury-spaceport\">the spaceport</a>. <a class=\"wl\" href=\"#axel\">Axel</a> leads <a class=\"wl\" href=\"#vega-squad\">Vega Squad</a> away, leaving the crew on standby.</p></div></div><div class=\"beat\"><div class=\"t\">M01</div><div class=\"b\"><strong>Medical cover</strong><p><a class=\"wl\" href=\"#armand\">Armand</a> confronts the crew. <a class=\"wl\" href=\"#nira-dathwen\">Nira</a> convinces him they are medical responders, but he orders them off the Moff's private pad.</p></div></div><div class=\"beat\"><div class=\"t\">M01</div><div class=\"b\"><strong>Return the booze</strong><p>Nira prepares a sedative, <a class=\"wl\" href=\"#voshkar\">Voshkar</a> distracts Armand, and the crew returns the doctored liquor before lifting off.</p></div></div><div class=\"beat\"><div class=\"t\">M01</div><div class=\"b\"><strong>Bad parking, good lead</strong><p>Following <a class=\"wl\" href=\"#tivik-ordo\">Tivik</a>'s discovery of excessive food orders, Kryss lands in the street, crushing a speeder and damaging the landing gear.</p></div></div><div class=\"beat\"><div class=\"t\">M01</div><div class=\"b\"><strong>The garrison below</strong><p>The crew discovers the Moff's extraction force beneath the port. Tivik rigs three charges around its lift access routes.</p></div></div><div class=\"beat\"><div class=\"t\">M01</div><div class=\"b\"><strong>The bluff breaks</strong><p>The crew finds <a class=\"wl\" href=\"#imperial-moff\">the Moff</a> unconscious. <a class=\"wl\" href=\"#lieutenant-voight\">Voight</a> blocks the attempted medical evacuation, triggering a firefight.</p></div></div><div class=\"beat\"><div class=\"t\">M01</div><div class=\"b\"><strong>Fighting withdrawal</strong><p>Stormtroopers and several droids fall; Armand is left bleeding and incapacitated. Kryss is injured. Tivik's charges detonate as the crew drags the Moff out.</p></div></div><div class=\"beat\"><div class=\"t\">M01</div><div class=\"b\"><strong>Vega left behind</strong><p>Nira directs Axel to Site B without arranging a pickup. Tivik flies the damaged freighter away with the live Moff aboard and Vega still on the ground.</p></div></div>", "backlinks": [], "search": "campaign timeline from support detail to an improvised moff extraction."}, {"id": "threads", "title": "Open Threads", "group": "Campaign", "type": "doc", "typeLabel": "Session", "layout": "threads", "dek": "A live prisoner, a stranded squad, and a freighter that needs work.", "conf": "", "confLabel": "", "player": "", "aliases": [], "aka": [], "html": "<div class=\"thread hot\"><div class=\"st\">After Session 1</div><h3>The Moff aboard</h3><p><a class=\"wl\" href=\"#imperial-moff\">The Moff</a> survived the extraction and is aboard the <a class=\"wl\" href=\"#mynocks-mullet\">Mynock's Mullet</a>. Where is the crew taking him, who receives him, and what happens when he wakes? No handover or payment has been established.</p></div><div class=\"thread hot\"><div class=\"st\">Extraction unresolved</div><h3>Vega left behind</h3><p><a class=\"wl\" href=\"#nira-dathwen\">Nira</a> told <a class=\"wl\" href=\"#axel\">Axel</a> to go to Site B, then the crew departed without <a class=\"wl\" href=\"#vega-squad\">Vega Squad</a>. No pickup or alternate rendezvous was agreed. His anger was already clear over the comlink.</p></div><div class=\"thread open\"><div class=\"st\">Repairs</div><h3>A damaged getaway ship</h3><p>The <a class=\"wl\" href=\"#mynocks-mullet\">Mynock's Mullet</a> escaped, but its left landing-gear assembly was damaged when <a class=\"wl\" href=\"#kryss-dorn\">Kryss</a> landed on a speeder. The damage has not been repaired.</p></div><div class=\"thread open\"><div class=\"st\">Recovery</div><h3>Wounds and supplies</h3><p>Kryss suffered blaster wounds and a scattered-senses critical injury. Nira also took fire. Completed medical treatment is not established. <a class=\"wl\" href=\"#tivik-ordo\">Tivik</a> used his three planted charges and a grenade in combat; remaining supplies need checking.</p></div><div class=\"thread open\"><div class=\"st\">Imperial response</div><h3>Witnesses at the port</h3><p><a class=\"wl\" href=\"#lieutenant-voight\">Voight</a> and surviving droids were still fighting when the crew withdrew. <a class=\"wl\" href=\"#armand\">Armand</a> was left incapacitated and bleeding, with his survival unconfirmed. The garrison found other exits despite the charges. The consequences of taking an Imperial Moff remain to be seen.</p></div><div class=\"thread open\"><div class=\"st\">Betrayal</div><h3>Kryss and the Empire</h3><p>Three applications to the <a class=\"wl\" href=\"#rebel-alliance\">Alliance</a>, three rejections. Meanwhile an offer from the <a class=\"wl\" href=\"#galactic-empire\">Empire</a> to join its commando ranks sits in <a class=\"wl\" href=\"#kryss-dorn\">Kryss</a>'s inbox, unanswered.</p></div><div class=\"thread open\"><div class=\"st\">Favour</div><h3>Voshkar's favours</h3><p><a class=\"wl\" href=\"#voshkar\">Voshkar</a>'s fitness empire was built with a lot of help, and he owes favours to a lot of people — on both sides of the war.</p></div><div class=\"thread open\"><div class=\"st\">Shame</div><h3>Nira's past</h3><p><a class=\"wl\" href=\"#nira-dathwen\">Nira</a> has been banned from practising medicine in the Core Worlds, and word of what happened is spreading. The forged credentials are expired.</p></div><div class=\"thread open\"><div class=\"st\">Blackmail</div><h3>Tivik's scam</h3><p><a class=\"wl\" href=\"#tivik-ordo\">Tivik</a> is blackmailing officials in both the <a class=\"wl\" href=\"#rebel-alliance\">Alliance</a> and the <a class=\"wl\" href=\"#galactic-empire\">Empire</a> at the same time, while his slicer handle sits on both sides' watchlists. Neither can be allowed to find out.</p></div><div class=\"thread open\"><div class=\"st\">Background</div><h3>Nira and Axel</h3><p><a class=\"wl\" href=\"#nira-dathwen\">Nira</a> knows <a class=\"wl\" href=\"#axel\">Axel</a>'s medical history and that of his not-so-faithful wife. That history now sits alongside a much more immediate grievance: leaving his squad behind.</p></div>", "backlinks": ["overview"], "search": "open threads a live prisoner, a stranded squad, and a freighter that needs work."}, {"id": "session-1", "title": "Session 1 — Medical Professionals Coming Through", "group": "Sessions", "type": "doc", "typeLabel": "Session", "layout": "prose", "dek": "A stolen drinks cabinet, a medical emergency of their own making, and one live Moff in the hold.", "conf": "", "confLabel": "", "player": "", "aliases": [], "aka": [], "html": "<p>The crew were supposed to deliver <a class=\"wl\" href=\"#vega-squad\">Vega Squad</a>, babysit the ship and be ready for extraction. Instead, they left with <a class=\"wl\" href=\"#imperial-moff\">the mission's target</a> alive, a damaged freighter and Vega still on the ground.</p><h2>The support act</h2><p>Using forged access codes and a landing arranged by an unnamed Alliance supporter, <a class=\"wl\" href=\"#kryss-dorn\">Kryss</a> brought the <a class=\"wl\" href=\"#mynocks-mullet\">Mynock's Mullet</a> into a luxury <a class=\"wl\" href=\"#luxury-spaceport\">spaceport</a> on an Imperial jungle world. His inverted approach ended in a neat touchdown and several decidedly unwell Vega operators. <a class=\"wl\" href=\"#axel\">Axel</a> told the crew to stay put, then his squad disappeared through every exit except the obvious one.</p><p><a class=\"wl\" href=\"#voshkar\">Voshkar</a> rigged a log trap that looked more likely to hit the ship than an attacker. Kryss and <a class=\"wl\" href=\"#tivik-ordo\">Tivik</a> broke into the reception area's liquor supply and carried off a case of expensive booze. <a class=\"wl\" href=\"#nira-dathwen\">Nira</a> found a perch above an entrance and settled in to watch.</p><h2>A very convenient emergency</h2><p><a class=\"wl\" href=\"#armand\">Armand</a> arrived with six security droids and wanted an explanation. Kryss tried charm and introduced himself by his real name. Nira followed with a better story: they were a medical extraction team waiting for a casualty, urgently in need of fuel. An expired medical credential and a conveniently timed emergency alert sold the lie.</p><p>There was one problem. They were occupying the Moff's personal landing pad, and he was inbound. Every other berth was full. Armand wanted both the freighter and its crew gone, and the liquor returned.</p><p>Tivik found reports of violence at a nearby educational establishment, apparently where Vega had gone looking for the Moff. The crew decided to reach the target first. While Voshkar distracted Armand with an unsuccessful attempt to steal his pen and a successful bite to the hand, Nira prepared a sedative for the liquor. Propaganda material helped identify the target as a Chandrilan man. They returned the doctored bottles and lifted off; Voshkar's logs tumbled onto the pad behind them.</p><h2>Beneath the luxury</h2><p>Before disconnecting from the port's systems, Tivik noticed repeated orders for enormous quantities of basic food, far beyond anything the reception area could need. With the Moff's Lambda shuttle now occupying their berth, the crew decided to investigate.</p><p>Kryss put the freighter down in a nearby street, crushing a speeder and damaging the left landing-gear assembly. All four entered through the public lobby and took a lift below the polished reception areas. They found military barracks and a sizable Imperial garrison: the Moff's extraction force. The food mystery had a much less profitable answer than they had hoped.</p><p>Tivik stayed behind to rig three charges around the lift access routes. The others went to Docking Bay Four to check on their patient.</p><h2>The bedside manner wears off</h2><p>The sedative had worked. The Moff lay unconscious amid anxious attendants, and Armand was relieved to see the supposed medical team return. Voshkar began dragging the patient by the ankles while Nira insisted on an immediate evacuation. <a class=\"wl\" href=\"#lieutenant-voight\">Voight</a> refused to let them take him. This time, the medical story did not hold.</p><p>Voight opened fire on Kryss. He killed the two stormtroopers guarding the scene, and his shots damaged an electrical panel, temporarily disrupting one group of security droids. Voshkar lunged for Armand and was knocked away with a datapad. Nira answered with a surgical vibroscalpel, badly wounding the deputy inspector and using him as a shield.</p><p>Tivik arrived after finishing the charges and destroyed a group of three droids with a frag grenade. Voshkar's next attack failed to injure Voight, but his filthy distraction left her prone. Kryss damaged the remaining droid group, then took return fire that left him wounded and with scattered senses. Nira's final attack put Armand out of the fight, bleeding heavily; nobody stopped to establish whether he would survive.</p><h2>Site B</h2><p>The charges detonated as the garrison responded. With alarms sounding and Voight and surviving droids still a threat, the crew made a fighting withdrawal. Voshkar hauled the Moff out by a rope around his legs while Kryss covered the retreat. The demolished lift routes bought time, but troops began emerging from other doors.</p><p>Nira called Axel, announced that they had the package and told Vega to use Site B, then ended the transmission amid furious protests. No pickup or alternate rendezvous was agreed. Tivik's vote of no confidence in Kryss's parking put him in the pilot's seat for departure, with Kryss relegated to co-pilot.</p><p>Tivik got the freighter airborne under fire. The crushed speeder remained caught on a landing leg long enough to strike nearby buildings, then fell among pursuing droids. The crew escaped the spaceport with the Moff alive. Vega stayed behind.</p><h2>Where things stand</h2><ul><li>The Moff is aboard; his destination, handover and what to do when he wakes remain unresolved.</li><li>Vega's extraction and the consequences of abandoning <a class=\"wl\" href=\"#axel\">Axel</a> are still open.</li><li>The freighter's damaged landing gear needs attention.</li><li>Kryss was wounded and suffered a critical injury; lasting recovery is not established in the recording. Nira also took blaster fire.</li><li>Armand was left incapacitated and bleeding. Voight and some security droids remained active during the withdrawal.</li></ul><div class=\"panel note\"><div class=\"ph\">Source and uncertain details</div><p>Based on the Session 1 recording transcript, from arrival through departure at approximately 01:48. The planet and spaceport are not clearly named. The Moff's name is unclear; Armand's surname and Lieutenant Voight's spelling need confirmation. Narrative outcomes take precedence over proposed actions and corrected combat bookkeeping.</p></div>", "backlinks": ["overview", "lieutenant-voight", "galactic-empire", "imperial-moff", "luxury-spaceport", "rebel-alliance", "voshkar"], "search": "session 1 — medical professionals coming through a stolen drinks cabinet, a medical emergency of their own making, and one live moff in the hold."}, {"id": "kryss-dorn", "title": "Kryss Dorn", "group": "Player Characters", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "The marksman. Takes the job, does the job, doesn't ask why.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>A human bounty hunter and assassin from Coruscant: professional, quiet and precise, built around one job — putting a shot exactly where it needs to go, at whatever range the moment calls for. He trusts his rifle more than any client.</p><h2>Kit</h2><p>A DDC MR6 modular rifle that switches between a scoped long rifle and a handier carbine, backed up by an SE-14C blaster pistol. Armoured clothing, sporting macrobinoculars, a spare reload and a pair of stimpacks. Quick on the draw and quick to react.</p><h2>History</h2><ul><li>Has applied to the <a class=\"wl\" href=\"#rebel-alliance\">Alliance</a> three times and been rejected three times. Still thinks he's Tier 1 material.</li><li>Has an open invitation from the <a class=\"wl\" href=\"#galactic-empire\">Empire</a> to join its commando ranks, sitting unanswered in his inbox.</li></ul><p><strong>Obligation:</strong> Betrayal.</p><h2>Session 1</h2><p>Piloted the arrival at the <a class=\"wl\" href=\"#luxury-spaceport\">the spaceport</a>, then damaged the ship's left landing gear while parking on a speeder in the street. In the firefight he killed two stormtroopers and disrupted security droids, but took blaster wounds and a scattered-senses critical injury. <a class=\"wl\" href=\"#tivik-ordo\">Tivik</a> took over for the escape. No completed treatment of the critical injury is established.</p>", "backlinks": ["axel", "timeline", "overview", "lieutenant-voight", "threads", "session-1", "galactic-empire", "mynocks-mullet", "rebel-alliance"], "search": "kryss dorn the marksman. takes the job, does the job, doesn't ask why."}, {"id": "nira-dathwen", "title": "Nira Dath'wen", "group": "Player Characters", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "A calm bedside manner and a sharper set of lies. The hands are steady; the credentials aren't.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>A Bothan doctor and social operator: persuasive first, surgeon second. Nira has real medical training and forged Core Worlds credentials that have since expired, and prefers to leave a room sedated rather than dead when a talked-in job goes wrong.</p><h2>Kit</h2><p>A surgical vibroscalpel, shock gloves and a holdout blaster, all small enough to handle with precision rather than strength. A medpac, five stimpacks and a concealed field surgical kit. Armoured clothing and a comlink. A Bothan's convincing demeanour smooths over the rough edges of a lie.</p><h2>History</h2><ul><li>Banned from practising medicine in the Core Worlds. Word of what happened is spreading.</li><li>The forged medical credentials are expired — a complication waiting for the right scene.</li><li>Knows everyone's medical history, including that of Axel, leader of <a class=\"wl\" href=\"#vega-squad\">Vega Squad</a>, and his not-so-faithful wife.</li></ul><p><strong>Obligation:</strong> Shame.</p><h2>Session 1</h2><p>Sold <a class=\"wl\" href=\"#armand\">Armand</a> a medical-extraction cover story, prepared the liquor that sedated <a class=\"wl\" href=\"#imperial-moff\">the Moff</a>, and tried to evacuate him under the same pretence. When <a class=\"wl\" href=\"#lieutenant-voight\">Voight</a> refused, Nira fought with a vibroscalpel and left Armand incapacitated and bleeding. Nira also took blaster fire, then told <a class=\"wl\" href=\"#axel\">Axel</a> to use Site B as the crew departed without Vega.</p>", "backlinks": ["axel", "timeline", "overview", "armand", "lieutenant-voight", "threads", "session-1", "imperial-moff", "vega-squad"], "search": "nira dath'wen a calm bedside manner and a sharper set of lies. the hands are steady; the credentials aren't."}, {"id": "tivik-ordo", "title": "Tivik Ordo", "group": "Player Characters", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "The slicer. Would rather not be seen at all.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>A Duros technician and droid tech: slicer, mechanic and demolitions support. A professional who thinks the job is the work, not the spotlight. Like most Duros, he has a feel for astrogation.</p><p>He is not built for sneaking, though — a real gap for a crew that may need to be smuggled in quietly.</p><h2>Kit</h2><p>Slicer gear and a datapad, a demolitions tool kit, three Destro-6 breaching charges and two frag grenades. An IR-5 blaster pistol with a filed front sight. Armoured clothing, a comlink and two stimpacks.</p><h2>History</h2><ul><li>His slicer handle is on both the <a class=\"wl\" href=\"#rebel-alliance\">Alliance</a> and <a class=\"wl\" href=\"#galactic-empire\">Empire</a> watchlists for questionable holonet activity.</li><li>Is currently blackmailing Alliance and Imperial officials in a concurrent scam. Neither side can find out.</li></ul><p><strong>Obligation:</strong> Blackmail.</p><h2>Session 1</h2><p>Accessed the <a class=\"wl\" href=\"#luxury-spaceport\">the spaceport</a>'s systems and discovered the food orders that led the crew to its hidden garrison. Rigged three charges around the lift routes, destroyed three security droids with a grenade, and flew the damaged <a class=\"wl\" href=\"#mynocks-mullet\">Mynock's Mullet</a> out with <a class=\"wl\" href=\"#imperial-moff\">the Moff</a> aboard. The charges detonated during the withdrawal. Explosive supplies need checking before the next job; the final escape narration does not establish a reliable remaining count.</p>", "backlinks": ["timeline", "overview", "kryss-dorn", "threads", "session-1", "galactic-empire", "luxury-spaceport", "mynocks-mullet", "rebel-alliance"], "search": "tivik ordo the slicer. would rather not be seen at all."}, {"id": "voshkar", "title": "Voshkar", "group": "Player Characters", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "The doorway-holder. Stands where the trouble is so nobody else has to.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>An Ewok hired gun and enforcer. Small enough to be underestimated, loud enough to prevent it, and dangerously enthusiastic about traps and close combat. In <a class=\"wl\" href=\"#session-1\">Session 1 — Medical Professionals Coming Through</a>, he spoke Ewok, stole attention more successfully than valuables, and hauled an Imperial Moff out by the ankles.</p><div class=\"panel note\"><div class=\"ph\">Campaign portrayal</div><p>Voshkar was introduced in the original character-sheet summary as a Trandoshan, but was consistently played and described as an Ewok in Session 1. This page follows the portrayal at the table; mechanical character-sheet changes are separate.</p></div><h2>Kit</h2><p>Kyuzo petars, portrayed in Session 1 as savage Ewok claws, and a shield gauntlet that turns him into cover for anyone standing behind him. A heavy blaster pistol for when a punch won't reach. Padded armour, a comlink and two stimpacks.</p><h2>History</h2><ul><li>Runs a personal training and fitness empire whose clients include both the <a class=\"wl\" href=\"#galactic-empire\">Empire</a> and the <a class=\"wl\" href=\"#rebel-alliance\">Alliance</a>.</li><li>Owes favours to a lot of people who helped him build it.</li><li>His face is recognisable in certain circles.</li></ul><p><strong>Obligation:</strong> Favour.</p><h2>Session 1</h2><p>Built an unreliable log trap, bit <a class=\"wl\" href=\"#armand\">Armand</a> while trying to steal his pen, and fought at close quarters during the failed medical extraction. His distraction left <a class=\"wl\" href=\"#lieutenant-voight\">Voight</a> prone. He dragged <a class=\"wl\" href=\"#imperial-moff\">the Moff</a> to the ship during the withdrawal; the prisoner survived.</p>", "backlinks": ["timeline", "overview", "armand", "lieutenant-voight", "threads", "session-1", "galactic-empire", "imperial-moff", "rebel-alliance"], "search": "voshkar the doorway-holder. stands where the trouble is so nobody else has to."}, {"id": "axel", "title": "Axel", "group": "Allies & Contacts", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "Vega's leader. Used to giving the support crew orders, less used to being left behind.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>The imposing leader of <a class=\"wl\" href=\"#vega-squad\">Vega Squad</a>. He treats the crew of the <a class=\"wl\" href=\"#mynocks-mullet\">Mynock's Mullet</a> as a transport and support detail, keeping them out of much of the briefing and expecting them ready for extraction.</p><p><a class=\"wl\" href=\"#nira-dathwen\">Nira</a> knows his medical history, and that of his not-so-faithful wife.</p><h2>Session 1</h2><p>After <a class=\"wl\" href=\"#kryss-dorn\">Kryss</a>'s exuberant landing, Axel told the crew to stay with the ship while Vega departed on its operation. Later, Nira called to say the crew had <a class=\"wl\" href=\"#imperial-moff\">the target</a> and directed Vega to Site B. Axel's answer was furious. The freighter left without his squad; no subsequent pickup is recorded.</p>", "backlinks": ["timeline", "overview", "nira-dathwen", "threads", "session-1", "vega-squad"], "search": "axel vega's leader. used to giving the support crew orders, less used to being left behind."}, {"id": "armand", "title": "Deputy Inspector Armand", "group": "Allies & Contacts", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "Wanted his landing pad cleared and his liquor returned. Had a much worse night.", "conf": "mid", "confLabel": "Needs review", "player": "", "aliases": [], "aka": [], "html": "<p>A meticulously dressed bureaucrat responsible for clearing <a class=\"wl\" href=\"#imperial-moff\">the Moff</a>'s private landing pad at the <a class=\"wl\" href=\"#luxury-spaceport\">the spaceport</a>. He carries a datapad, a pistol and a pen that <a class=\"wl\" href=\"#voshkar\">Voshkar</a> badly wanted.</p><h2>Session 1</h2><p>Armand confronted the crew with six security droids. <a class=\"wl\" href=\"#nira-dathwen\">Nira</a> convinced him they were medical responders, but he still required them to move the ship and return the liquor. He accepted the returned case without discovering the sedative.</p><p>When the crew returned to collect the unconscious Moff, Armand initially welcomed their help. The attempted extraction became a firefight. He knocked Voshkar away with his datapad, then was severely wounded by Nira's vibroscalpel. He was left incapacitated and bleeding; his eventual survival is unconfirmed.</p><div class=\"panel note\"><div class=\"ph\">Name needs confirmation</div><p>The recording variously transcribes his surname as Quillerin, Quilleran and Quillerian. This page uses Armand until the spelling is confirmed.</p></div>", "backlinks": ["timeline", "nira-dathwen", "threads", "session-1", "imperial-moff", "luxury-spaceport", "voshkar"], "search": "deputy inspector armand wanted his landing pad cleared and his liquor returned. had a much worse night."}, {"id": "lieutenant-voight", "title": "Lieutenant Voight", "group": "Allies & Contacts", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "The officer who did not buy the medical evacuation.", "conf": "mid", "confLabel": "Needs review", "player": "", "aliases": [], "aka": [], "html": "<p>A human Imperial lieutenant accompanying <a class=\"wl\" href=\"#imperial-moff\">the Moff</a> at the <a class=\"wl\" href=\"#luxury-spaceport\">the spaceport</a> in <a class=\"wl\" href=\"#session-1\">Session 1 — Medical Professionals Coming Through</a>. The transcript most often renders her name as Voight; its spelling remains provisional.</p><p>She refused to let the crew take the unconscious Moff and opened fire when <a class=\"wl\" href=\"#nira-dathwen\">Nira</a>'s deception failed. She concentrated on <a class=\"wl\" href=\"#kryss-dorn\">Kryss</a>, recognising the threat posed by his rifle, and wounded him.</p><p><a class=\"wl\" href=\"#voshkar\">Voshkar</a> knocked her prone through a distraction, but did not defeat her. She was still firing during the crew's withdrawal. Her next move is unknown.</p>", "backlinks": ["timeline", "nira-dathwen", "threads", "session-1", "galactic-empire", "imperial-moff", "voshkar"], "search": "lieutenant voight the officer who did not buy the medical evacuation."}, {"id": "imperial-moff", "title": "The Imperial Moff", "group": "Allies & Contacts", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "The target came aboard alive. He did not come aboard willingly.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>A Chandrilan Imperial Moff and the target of the operation in <a class=\"wl\" href=\"#session-1\">Session 1 — Medical Professionals Coming Through</a>. His personal name is not clear enough in the recording to establish a canonical spelling.</p><p>He arrived by Lambda shuttle at his private berth in the <a class=\"wl\" href=\"#luxury-spaceport\">the spaceport</a>, supported by attendants, <a class=\"wl\" href=\"#lieutenant-voight\">Voight</a>, stormtroopers and a garrison housed beneath the port. <a class=\"wl\" href=\"#armand\">Armand</a> had been preparing the landing pad for him.</p><h2>Capture</h2><p><a class=\"wl\" href=\"#nira-dathwen\">Nira</a> sedated him through doctored liquor, then attempted to remove him under cover of a medical evacuation. When that failed, the crew fought their way out. <a class=\"wl\" href=\"#voshkar\">Voshkar</a> dragged him to the <a class=\"wl\" href=\"#mynocks-mullet\">Mynock's Mullet</a>, and he survived the extraction.</p><p>At the end of Session 1 he is alive aboard the crew's ship. No handover, interrogation or final destination has been established.</p>", "backlinks": ["axel", "timeline", "overview", "armand", "lieutenant-voight", "nira-dathwen", "threads", "session-1", "galactic-empire", "luxury-spaceport", "mynocks-mullet", "rebel-alliance", "tivik-ordo", "vega-squad", "voshkar"], "search": "the imperial moff the target came aboard alive. he did not come aboard willingly."}, {"id": "luxury-spaceport", "title": "The Luxury Spaceport", "group": "Places", "type": "place", "typeLabel": "Place", "layout": "prose", "dek": "Private berths and a botanical garden above. An Imperial extraction force below.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>A ground-based spaceport on an unnamed Imperial jungle world, visited in <a class=\"wl\" href=\"#session-1\">Session 1 — Medical Professionals Coming Through</a>. Neither the world's name nor the port's proper name is established clearly in the recording.</p><h2>Layout</h2><p>Around ten to twelve landing pads form a ring around a central botanical garden. The public lobby operates around the clock, with lifts leading to lower levels. Docking Bay Four is <a class=\"wl\" href=\"#imperial-moff\">the Moff</a>'s private berth, with an expensive reception area and liquor supply. <a class=\"wl\" href=\"#armand\">Armand</a> oversees preparations there.</p><h2>Beneath the port</h2><p><a class=\"wl\" href=\"#tivik-ordo\">Tivik</a> noticed repeated orders for unusually large quantities of cheap food. The crew investigated and discovered a sizable military garrison beneath the luxury facilities, assigned to support the Moff's extraction. This explained the supplies; the speculation about smuggling was never confirmed.</p><h2>After the raid</h2><p>Tivik rigged three charges around lift access routes. They detonated when the garrison responded to the firefight, delaying pursuit without sealing every exit. Troops emerged through other doors as the crew fled. The Moff was taken alive, the reception area became a battlefield, and the <a class=\"wl\" href=\"#mynocks-mullet\">Mynock's Mullet</a> escaped from a nearby street after damaging its landing gear on a speeder.</p>", "backlinks": ["timeline", "overview", "armand", "kryss-dorn", "lieutenant-voight", "session-1", "galactic-empire", "imperial-moff", "mynocks-mullet", "rebel-alliance", "tivik-ordo", "vega-squad"], "search": "the luxury spaceport private berths and a botanical garden above. an imperial extraction force below."}, {"id": "mynocks-mullet", "title": "The Mynock's Mullet", "group": "Ships", "type": "ship", "typeLabel": "Ship", "layout": "prose", "dek": "Built to be forgotten the moment it's out of sight.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>The crew's ship: a modified light freighter with battered, mismatched hull plating and a scrubbed registry. It is deliberately nondescript, one of thousands like it in the Outer Rim.</p><p>It carries a single light laser cannon in a turret that covers every arc, crewed from the gunner's position.</p><h2>Session 1</h2><p>Carried <a class=\"wl\" href=\"#vega-squad\">Vega Squad</a> into the <a class=\"wl\" href=\"#luxury-spaceport\">the spaceport</a> under forged codes. <a class=\"wl\" href=\"#kryss-dorn\">Kryss</a> later landed it on a speeder in a nearby street, damaging the left landing-gear assembly. <a class=\"wl\" href=\"#tivik-ordo\">Tivik</a> flew the escape with the speeder still caught on a landing leg until it fell away. The crew and <a class=\"wl\" href=\"#imperial-moff\">the captive Moff</a> got out; Vega did not come aboard. Repairs and the next landing remain outstanding.</p>", "backlinks": ["axel", "timeline", "overview", "threads", "session-1", "imperial-moff", "luxury-spaceport", "tivik-ordo", "vega-squad"], "search": "the mynock's mullet built to be forgotten the moment it's out of sight."}, {"id": "galactic-empire", "title": "The Galactic Empire", "group": "Factions", "type": "faction", "typeLabel": "Faction", "layout": "prose", "dek": "One side of the war. The crew are tangled up with it anyway.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>In <a class=\"wl\" href=\"#session-1\">Session 1 — Medical Professionals Coming Through</a>, the crew abducted <a class=\"wl\" href=\"#imperial-moff\">an Imperial Moff</a> from the <a class=\"wl\" href=\"#luxury-spaceport\">the spaceport</a>, fought his escort and delayed the port's garrison with explosives. <a class=\"wl\" href=\"#lieutenant-voight\">Voight</a> remained active during their escape.</p><p>The crew's older ties to the Empire:</p><ul><li><a class=\"wl\" href=\"#kryss-dorn\">Kryss</a> has an open invitation to join its commando ranks.</li><li><a class=\"wl\" href=\"#voshkar\">Voshkar</a> counts Imperial clients in his training empire.</li><li><a class=\"wl\" href=\"#tivik-ordo\">Tivik</a>'s handle is on an Imperial watchlist, and he is blackmailing Imperial officials.</li></ul>", "backlinks": ["overview", "kryss-dorn", "threads", "tivik-ordo", "voshkar"], "search": "the galactic empire one side of the war. the crew are tangled up with it anyway."}, {"id": "rebel-alliance", "title": "The Rebel Alliance", "group": "Factions", "type": "faction", "typeLabel": "Faction", "layout": "prose", "dek": "The other side of the war. The crew are tangled up with it too.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": ["The Rebels", "The Alliance"], "html": "<p>In <a class=\"wl\" href=\"#session-1\">Session 1 — Medical Professionals Coming Through</a>, an unnamed Alliance supporter arranged the crew's landing at the <a class=\"wl\" href=\"#luxury-spaceport\">the spaceport</a> for the operation against <a class=\"wl\" href=\"#imperial-moff\">the Moff</a>. The crew delivered <a class=\"wl\" href=\"#vega-squad\">Vega Squad</a>, then departed with the target alive and Vega still on the ground. No subsequent debrief or handover has been recorded.</p><p>The crew's older ties to the Alliance:</p><ul><li><a class=\"wl\" href=\"#kryss-dorn\">Kryss</a> has applied to join three times and been turned down three times.</li><li><a class=\"wl\" href=\"#voshkar\">Voshkar</a> counts Rebel clients in his training empire.</li><li><a class=\"wl\" href=\"#tivik-ordo\">Tivik</a>'s handle is on an Alliance watchlist, and he is blackmailing Alliance officials.</li></ul>", "backlinks": ["overview", "kryss-dorn", "threads", "tivik-ordo", "voshkar"], "search": "the rebel alliance the rebels the alliance the other side of the war. the crew are tangled up with it too."}, {"id": "vega-squad", "title": "Vega Squad", "group": "Factions", "type": "faction", "typeLabel": "Faction", "layout": "prose", "dek": "The elite operators went after the target. Their support crew got there first.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": ["Vega Company"], "html": "<p>An elite squad led by <a class=\"wl\" href=\"#axel\">Axel</a>, also called Vega Company. The crew of the <a class=\"wl\" href=\"#mynocks-mullet\">Mynock's Mullet</a> serves as its transport and support detail, receives limited briefing and gets little respect in return. <a class=\"wl\" href=\"#nira-dathwen\">Nira</a> knows Axel's medical history and that of his not-so-faithful wife.</p><h2>Session 1</h2><p>Vega disembarked at the <a class=\"wl\" href=\"#luxury-spaceport\">the spaceport</a> and headed into the city on an operation targeting <a class=\"wl\" href=\"#imperial-moff\">an Imperial Moff</a>. Reports and visible fires placed their apparent activity at a nearby educational establishment while the Moff arrived at the port instead.</p><p>The crew captured the Moff and left without collecting Vega. Nira told Axel to go to Site B, but no alternate rendezvous or later pickup was agreed. Vega's extraction remains unresolved.</p>", "backlinks": ["axel", "timeline", "overview", "nira-dathwen", "threads", "session-1", "mynocks-mullet", "rebel-alliance"], "search": "vega squad vega company the elite operators went after the target. their support crew got there first."}, {"id": "talents", "title": "Talents", "group": "Reference", "type": "doc", "typeLabel": "Session", "layout": "talents", "dek": "Search and filter the full talent catalogue by tier, activation and ranked status.", "conf": "", "confLabel": "", "player": "", "aliases": [], "aka": [], "html": "<p>The catalogue uses the Star Wars narrative-dice wording from the shared talent reference. Use the controls below to narrow the list; ordinary text search also matches rules text and source abbreviations.</p>", "backlinks": [], "search": "talents search and filter the full talent catalogue by tier, activation and ranked status."}];

": "ROT", "from": "Zealous Fire", "superseded": null, "search": "zealous fire 5 passive no each time your game master spends a story point, your character heals 2 strain. rot zealous fire"}];
const BUILT  = "2026-10-01";
const CAMPAIGN = "Deniable Assets";
const SOURCE_NOTE = "Compiled from the crew's introductory character sheets and session recordings transcribed with <code>faster-whisper</code>. This public archive records established play and flags uncertain details.";
const byId = Object.fromEntries(PAGES.map(p => [p.id, p]));
let current = PAGES.length ? PAGES[0].id : "";

const main = document.getElementById("main");
const nav  = document.getElementById("nav");
const q    = document.getElementById("q");

function esc(value){
  return String(value == null ? "" : value).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function activationGroup(value){
  const a = String(value || "").toLowerCase();
  if(a === "passive") return "Passive";
  if(a.includes("out of turn") || a.includes("out-of-turn") || a.includes("oot")) return "Out of turn";
  if(a.includes("action")) return "Action";
  if(a.includes("maneuver")) return "Maneuver";
  return "Incidental";
}

function talentLibrary(){
  const tiers = [...new Set(TALENTS.map(t => t.tier))].sort((a,b) => a-b);
  return '<div class="talent-controls">'
    + '<input id="talent-q" type="search" placeholder="Search names, rules or sources&hellip;" aria-label="Search talents">'
    + '<select id="talent-tier" aria-label="Filter by tier"><option value="">All tiers</option>' + tiers.map(t => '<option value="' + t + '">Tier ' + t + '</option>').join('') + '</select>'
    + '<select id="talent-activation" aria-label="Filter by activation"><option value="">All activations</option><option>Passive</option><option>Action</option><option>Maneuver</option><option>Incidental</option><option>Out of turn</option></select>'
    + '<select id="talent-ranked" aria-label="Filter by ranked status"><option value="">Ranked or unranked</option><option value="Yes">Ranked</option><option value="No">Unranked</option></select>'
    + '</div><div class="talent-summary" id="talent-summary"></div><div class="talent-list" id="talent-list"></div>';
}

function wireTalentLibrary(){
  const search = document.getElementById("talent-q");
  if(!search) return;
  const tier = document.getElementById("talent-tier");
  const activation = document.getElementById("talent-activation");
  const ranked = document.getElementById("talent-ranked");
  const list = document.getElementById("talent-list");
  const summary = document.getElementById("talent-summary");
  function update(){
    const needle = search.value.trim().toLowerCase();
    const matches = TALENTS.filter(t =>
      (!needle || t.search.includes(needle)) &&
      (!tier.value || String(t.tier) === tier.value) &&
      (!activation.value || activationGroup(t.activation) === activation.value) &&
      (!ranked.value || t.ranked === ranked.value)
    );
    summary.textContent = matches.length + (matches.length === 1 ? " talent" : " talents") + " shown of " + TALENTS.length;
    list.innerHTML = matches.length ? matches.map(t =>
      '<article class="talent-card"><div class="talent-head"><h2>' + esc(t.name) + '</h2><span class="talent-tier">Tier ' + esc(t.tier) + '</span></div>'
      + '<div class="talent-meta">' + esc(t.activation) + ' · ' + (t.ranked === "Yes" ? "Ranked" : "Unranked") + '</div>'
      + '<p>' + esc(t.text) + '</p>'
      + '<div class="talent-source">Source: ' + esc(t.source || "Not listed") + (t.from && t.from !== t.name ? ' · Adapted from ' + esc(t.from) : '') + '</div>'
      + (t.superseded ? '<div class="talent-note">Superseded by version: ' + esc(t.superseded) + '</div>' : '')
      + '</article>').join('') : '<div class="talent-empty">No talents match these filters.</div>';
  }
  [search,tier,activation,ranked].forEach(el => el.addEventListener(el === search ? "input" : "change", update));
  update();
}

function renderPage(id){
  const p = byId[id];
  if(!p) return "<p>Page not found.</p>";
  let h = '<div class="crumb">' + p.group + '</div>';
  h += '<h1 class="ttl">' + p.title + '</h1>';
  if(p.dek) h += '<div class="dek">' + p.dek + '</div>';

  if(p.type !== "doc"){
    h += '<div class="badges"><span class="tag t-' + p.type + '">' + p.typeLabel + '</span>';
    if(p.player) h += '<span class="tag">Played by ' + p.player + '</span>';
    if(p.conf)   h += '<span class="tag"><span class="conf"><span class="dot ' + p.conf + '"></span>' + p.confLabel + '</span></span>';
    h += '</div>';
    if(p.aka && p.aka.length){
      h += '<div class="panel"><div class="ph">Also known as</div><div>'
         + p.aka.map(a => '<span class="alias">' + a + '</span>').join('')
         + '</div></div>';
    }
    if(p.aliases.length){
      h += '<div class="panel"><div class="ph">Also transcribed as</div><div>'
         + p.aliases.map(a => '<span class="alias">' + a + '</span>').join('')
         + '</div></div>';
    }
  }

  h += '<div class="prose">' + p.html + '</div>';
  if(p.layout === "talents") h += talentLibrary();

  if(p.backlinks.length){
    h += '<div class="backlinks"><div class="ph">Mentioned in</div><ul>'
       + p.backlinks.map(b => '<li><a href="#' + b + '">' + TITLES[b] + '</a></li>').join('')
       + '</ul></div>';
  }

  h += '<div class="foot">' + SOURCE_NOTE + ' Built ' + BUILT + '.</div>';
  return h;
}

function renderNav(filter){
  const f = (filter || "").trim().toLowerCase();
  const groups = [];
  PAGES.forEach(p => {
    if(f && p.search.indexOf(f) === -1) return;
    let g = groups.find(x => x.name === p.group);
    if(!g){ g = {name:p.group, items:[]}; groups.push(g); }
    g.items.push(p);
  });
  if(!groups.length) return '<div style="padding:4px 20px;color:var(--muted);font-size:14px">Nothing matches.</div>';
  return groups.map(g =>
    '<div class="grp"><div class="lbl">' + g.name + '</div>'
    + g.items.map(p =>
        '<a href="#' + p.id + '"' + (p.id === current ? ' aria-current="page"' : '') + '>'
        + '<span>' + p.title + '</span>'
        + (p.type !== "doc" && p.backlinks.length ? '<span class="n">' + p.backlinks.length + '</span>' : '')
        + '</a>').join('')
    + '</div>').join('');
}

function route(){
  const id = decodeURIComponent(location.hash.slice(1));
  current = byId[id] ? id : (PAGES.length ? PAGES[0].id : "");
  main.innerHTML = renderPage(current);
  if(byId[current] && byId[current].layout === "talents") wireTalentLibrary();
  nav.innerHTML = renderNav(q.value);
  document.title = (byId[current] ? byId[current].title + " · " : "") + CAMPAIGN;
  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", route);
q.addEventListener("input", function(){ nav.innerHTML = renderNav(q.value); });

document.getElementById("themebtn").addEventListener("click", function(){
  const root = document.documentElement;
  const now = root.getAttribute("data-theme");
  const dark = now ? now === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  root.setAttribute("data-theme", dark ? "light" : "dark");
  try { localStorage.setItem("wd-theme", dark ? "light" : "dark"); } catch(e){}
});
try {
  const saved = localStorage.getItem("wd-theme");
  if(saved) document.documentElement.setAttribute("data-theme", saved);
} catch(e){}

route();
</script>
