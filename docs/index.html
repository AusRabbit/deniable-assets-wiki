<script>
const PAGES  = [{"id": "overview", "title": "Deniable Assets", "group": "Campaign", "type": "doc", "typeLabel": "Session", "layout": "prose", "dek": "Four operatives, one damaged freighter, and a handler who has run out of patience.", "conf": "", "confLabel": "", "player": "", "aliases": [], "aka": [], "html": "<p>The crew began as transport and support for <a class=\"wl\" href=\"#vega-squad\">Vega Squad</a> on an operation against <a class=\"wl\" href=\"#imperial-moff\">an Imperial Moff</a>. A stolen case of liquor, an improvised medical cover story and a firefight later, they escaped with the target alive — and left Vega behind.</p><h2>Current Situation</h2><p>After <a class=\"wl\" href=\"#session-2\">Session 2 — Babysitting Duty</a>, the Moff is in Rebel hands with a fractured skull, and <a class=\"wl\" href=\"#kel-oramm\">Major Oramm</a> has docked the crew's pay and refused to repair the <a class=\"wl\" href=\"#mynocks-mullet\">Mynock's Mullet</a>. Rebel Intelligence has sent Kryss, Nira and Tivik to <a class=\"wl\" href=\"#brentaal-iv\">Brentaal IV</a> to find <a class=\"wl\" href=\"#feeler\">Feeler</a>, the slicer who got them onto the Moff's pad. They hold Feeler's <a class=\"wl\" href=\"#droid-factory\">droid factory</a>, with enough intelligence inside to find the function Feeler is attending. <a class=\"wl\" href=\"#voshkar\">Voshkar</a> is \"indisposed\" back on the <a class=\"wl\" href=\"#rebel-frigate\">frigate</a>. See <a class=\"wl\" href=\"#threads\">Open Threads</a> for the unfinished business.</p><h2>The Crew</h2><ul><li><a class=\"wl\" href=\"#kryss-dorn\">Kryss</a> — Human bounty hunter and assassin. The marksman.</li><li><a class=\"wl\" href=\"#voshkar\">Voshkar</a> — Ewok enforcer. The one who stands in the doorway.</li><li><a class=\"wl\" href=\"#nira-dathwen\">Nira</a> — Bothan doctor and social operator, with credentials that expired a while ago.</li><li><a class=\"wl\" href=\"#tivik-ordo\">Tivik</a> — Duros slicer and demolitions tech, wanted by both sides for his holonet habits.</li></ul><h2>The Ship</h2><p>The <a class=\"wl\" href=\"#mynocks-mullet\">Mynock's Mullet</a>, a battered light freighter with mismatched plating and a scrubbed registry — one of thousands like it in the Outer Rim.</p><h2>Both Sides of the War</h2><p>Every member of the crew is tangled up with both the <a class=\"wl\" href=\"#galactic-empire\">Empire</a> and the <a class=\"wl\" href=\"#rebel-alliance\">Alliance</a>. <a class=\"wl\" href=\"#kryss-dorn\">Kryss</a> keeps applying to the Rebels and keeps getting an Imperial offer instead. <a class=\"wl\" href=\"#voshkar\">Voshkar</a> trains clients from both. <a class=\"wl\" href=\"#tivik-ordo\">Tivik</a> is on both sides' watchlists and is blackmailing officials in each. <a class=\"wl\" href=\"#nira-dathwen\">Nira</a> can no longer practise in the Core Worlds at all. See <a class=\"wl\" href=\"#threads\">Open Threads</a>.</p><h2>How We Play</h2><ul><li>Players roll all of their own characters' checks. The GM rolls NPC checks openly and never rolls for a player character.</li><li>The difficulty of a check is stated before you roll, and it depends on the actual stakes rather than a fixed default.</li><li>Declare what you want to do in your own words. There's no numbered menu of options.</li><li>Initiative slots aren't assigned to specific characters; anyone eligible on that side can take one.</li><li>Armour <strong>defense</strong> adds setback dice to attacks against you; <strong>soak</strong> (Brawn plus armour) reduces damage. Defense was overlooked in the first two sessions and applies from now on.</li><li>Critical injuries stay on your record even once treated; each one adds +10 to the next critical roll.</li><li>Gear doesn't run on a price list. At the end of a mission, pick a reward — a weapon, armour or a piece of equipment. Between missions, you can also negotiate with the quartermaster on the frigate.</li><li>Hooks and flags are welcome. Invent links between your characters as you play, and tell the table what you want your character's big moment to be.</li></ul>", "backlinks": [], "search": "deniable assets four operatives, one damaged freighter, and a handler who has run out of patience."}, {"id": "timeline", "title": "Campaign Timeline", "group": "Campaign", "type": "doc", "typeLabel": "Session", "layout": "timeline", "dek": "From support detail to an improvised Moff extraction, and a slicer hunt on Brentaal IV.", "conf": "", "confLabel": "", "player": "", "aliases": [], "aka": [], "html": "<h2>Session 1</h2><div class=\"beat\"><div class=\"t\">M01</div><div class=\"b\"><strong>A stylish arrival</strong><p><a class=\"wl\" href=\"#kryss-dorn\">Kryss</a> lands the <a class=\"wl\" href=\"#mynocks-mullet\">Mynock's Mullet</a> at the <a class=\"wl\" href=\"#luxury-spaceport\">luxury spaceport</a>. <a class=\"wl\" href=\"#axel\">Axel</a> leads <a class=\"wl\" href=\"#vega-squad\">Vega Squad</a> away, leaving the crew on standby.</p></div></div><div class=\"beat\"><div class=\"t\">M01</div><div class=\"b\"><strong>Medical cover</strong><p><a class=\"wl\" href=\"#armand\">Armand</a> confronts the crew. <a class=\"wl\" href=\"#nira-dathwen\">Nira</a> convinces him they are medical responders, but he orders them off the Moff's private pad.</p></div></div><div class=\"beat\"><div class=\"t\">M01</div><div class=\"b\"><strong>Return the booze</strong><p>Nira prepares a sedative, <a class=\"wl\" href=\"#voshkar\">Voshkar</a> distracts Armand, and the crew returns the doctored liquor before lifting off.</p></div></div><div class=\"beat\"><div class=\"t\">M01</div><div class=\"b\"><strong>Bad parking, good lead</strong><p>Following <a class=\"wl\" href=\"#tivik-ordo\">Tivik</a>'s discovery of excessive food orders, Kryss lands in the street, crushing a speeder and damaging the landing gear.</p></div></div><div class=\"beat\"><div class=\"t\">M01</div><div class=\"b\"><strong>The garrison below</strong><p>The crew discovers the Moff's extraction force beneath the port. Tivik rigs three charges around its lift access routes.</p></div></div><div class=\"beat\"><div class=\"t\">M01</div><div class=\"b\"><strong>The bluff breaks</strong><p>The crew finds <a class=\"wl\" href=\"#imperial-moff\">the Moff</a> unconscious. <a class=\"wl\" href=\"#lieutenant-voight\">Voight</a> blocks the attempted medical evacuation, triggering a firefight.</p></div></div><div class=\"beat\"><div class=\"t\">M01</div><div class=\"b\"><strong>Fighting withdrawal</strong><p>Stormtroopers and several droids fall; Armand is left bleeding and incapacitated. Kryss is injured. Tivik's charges detonate as the crew drags the Moff out.</p></div></div><div class=\"beat\"><div class=\"t\">M01</div><div class=\"b\"><strong>Vega left behind</strong><p>Nira directs Axel to Site B without arranging a pickup. Tivik flies the damaged freighter away with the live Moff aboard and Vega still on the ground.</p></div></div><h2>Session 2</h2><div class=\"beat\"><div class=\"t\">INT</div><div class=\"b\"><strong>The debrief</strong><p>Aboard the <a class=\"wl\" href=\"#rebel-frigate\">Rebel frigate</a>, <a class=\"wl\" href=\"#kel-oramm\">Major Oramm</a> learns Vega was left behind and that the Moff has a fractured skull. He docks the crew's pay and refuses repairs. <a class=\"wl\" href=\"#tivik-ordo\">Tivik</a> pockets his thrown datapad.</p></div></div><div class=\"beat\"><div class=\"t\">INT</div><div class=\"b\"><strong>A new assignment</strong><p>Rebel Intelligence wants the slicer <a class=\"wl\" href=\"#feeler\">Feeler</a>, who arranged the crew's landing at the Moff's pad, brought in from <a class=\"wl\" href=\"#brentaal-iv\">Brentaal IV</a>.</p></div></div><div class=\"beat\"><div class=\"t\">INT</div><div class=\"b\"><strong>Requisitions</strong><p><a class=\"wl\" href=\"#kryss-dorn\">Kryss</a>'s pistol on the counter gets Tivik a case of explosives for 200 credits. <a class=\"wl\" href=\"#voshkar\">Voshkar</a> is held back for drug and alcohol testing.</p></div></div><div class=\"beat\"><div class=\"t\">M02</div><div class=\"b\"><strong>Asking for Feeler</strong><p>At a shift workers' bar, the bartender reveals that new data cabling was recently installed in a derelict warehouse nearby. Two thugs try to rob <a class=\"wl\" href=\"#nira-dathwen\">Nira</a> outside and are driven off.</p></div></div><div class=\"beat\"><div class=\"t\">M02</div><div class=\"b\"><strong>Into the droid factory</strong><p>Kryss freezes on a pressure-plate mine that Tivik disarms. Nira is caught under a ceiling net.</p></div></div><div class=\"beat\"><div class=\"t\">M02</div><div class=\"b\"><strong>Hush and Whisper</strong><p>Two lurker droids ambush the crew. Whisper is destroyed; Hush is stunned and sliced, revealing that Feeler built them and is away at a function.</p></div></div>", "backlinks": [], "search": "campaign timeline from support detail to an improvised moff extraction, and a slicer hunt on brentaal iv."}, {"id": "threads", "title": "Open Threads", "group": "Campaign", "type": "doc", "typeLabel": "Session", "layout": "threads", "dek": "A missing slicer, a stolen datapad, an absent Ewok, and a freighter nobody will fix.", "conf": "", "confLabel": "", "player": "", "aliases": [], "aka": [], "html": "<div class=\"thread hot\"><div class=\"st\">Brentaal IV</div><h3>Find Feeler</h3><p>Rebel Intelligence wants the slicer <a class=\"wl\" href=\"#feeler\">Feeler</a> brought in. Feeler arranged the crew's landing at the Moff's pad, then went silent. Feeler's <a class=\"wl\" href=\"#droid-factory\">droid factory</a> on <a class=\"wl\" href=\"#brentaal-iv\">Brentaal IV</a> holds enough intelligence to identify Feeler's next move: a function somewhere on the planet. Feeler's guard droids, <a class=\"wl\" href=\"#hush-and-whisper\">Hush and Whisper</a>, are already down.</p></div><div class=\"thread hot\"><div class=\"st\">Unread</div><h3>Oramm's datapad</h3><p><a class=\"wl\" href=\"#tivik-ordo\">Tivik</a> pocketed the sensitive briefing datapad that <a class=\"wl\" href=\"#kel-oramm\">Major Oramm</a> threw during the debrief. Its contents haven't been revealed. Oramm was too angry to notice.</p></div><div class=\"thread open\"><div class=\"st\">Indisposed</div><h3>Where is Voshkar?</h3><p><a class=\"wl\" href=\"#voshkar\">Voshkar</a> was pulled aside for random drug and alcohol testing on the <a class=\"wl\" href=\"#rebel-frigate\">Rebel frigate</a> and never came back. The Rebels say only that he is \"indisposed\". He may turn up mid-mission.</p></div><div class=\"thread hot\"><div class=\"st\">Obligation carried over</div><h3>Tivik's scam</h3><p><a class=\"wl\" href=\"#tivik-ordo\">Tivik</a> is blackmailing officials in both the <a class=\"wl\" href=\"#rebel-alliance\">Alliance</a> and the <a class=\"wl\" href=\"#galactic-empire\">Empire</a> at the same time, while his slicer handle sits on both sides' watchlists. His obligation came up at the end of Session 1, and one of his scams is coming to a head. It didn't trigger in Session 2; the GM has carried it into Session 3.</p></div><div class=\"thread open\"><div class=\"st\">Expected to surface</div><h3>Vega left behind</h3><p><a class=\"wl\" href=\"#nira-dathwen\">Nira</a> told <a class=\"wl\" href=\"#axel\">Axel</a> to go to Site B, then the crew departed without <a class=\"wl\" href=\"#vega-squad\">Vega Squad</a>. Rebel command expects Vega to surface on its own. <a class=\"wl\" href=\"#kel-oramm\">Major Oramm</a> says this is not the first time the crew has left them in the lurch. Axel's anger was already clear over the comlink.</p></div><div class=\"thread open\"><div class=\"st\">Repairs refused</div><h3>A damaged getaway ship</h3><p>The <a class=\"wl\" href=\"#mynocks-mullet\">Mynock's Mullet</a>'s left landing-gear assembly was damaged when <a class=\"wl\" href=\"#kryss-dorn\">Kryss</a> landed on a speeder. <a class=\"wl\" href=\"#kel-oramm\">Major Oramm</a> has refused to repair it at the Rebellion's expense, and the crew's pay is docked.</p></div><div class=\"thread open\"><div class=\"st\">Recovery</div><h3>Wounds and supplies</h3><p>Kryss's Scattered Senses critical injury no longer has an effect, but it remains on his record. He took another beating from the lurker droids and was patched up with a medpac and a stim. Tivik restocked with a case of grenades and charges and owes the quartermaster 200 credits. A thug's bag of unidentified white powder is in Kryss's pocket.</p></div><div class=\"thread open\"><div class=\"st\">Imperial response</div><h3>Witnesses at the port</h3><p><a class=\"wl\" href=\"#lieutenant-voight\">Voight</a> and surviving droids were still fighting when the crew withdrew. <a class=\"wl\" href=\"#armand\">Armand</a> was left incapacitated and bleeding, with his survival unconfirmed. The garrison found other exits despite the charges. The consequences of taking an Imperial Moff remain to be seen.</p></div><div class=\"thread open\"><div class=\"st\">Betrayal</div><h3>Kryss and the Empire</h3><p>Three applications to the <a class=\"wl\" href=\"#rebel-alliance\">Alliance</a>, three rejections. Meanwhile an offer from the <a class=\"wl\" href=\"#galactic-empire\">Empire</a> to join its commando ranks sits in <a class=\"wl\" href=\"#kryss-dorn\">Kryss</a>'s inbox, unanswered.</p></div><div class=\"thread open\"><div class=\"st\">Favour</div><h3>Voshkar's favours</h3><p><a class=\"wl\" href=\"#voshkar\">Voshkar</a>'s fitness empire was built with a lot of help, and he owes favours to a lot of people — on both sides of the war.</p></div><div class=\"thread open\"><div class=\"st\">Shame</div><h3>Nira's past</h3><p><a class=\"wl\" href=\"#nira-dathwen\">Nira</a> has been banned from practising medicine in the Core Worlds, and word of what happened is spreading. The forged credentials are expired.</p></div><div class=\"thread open\"><div class=\"st\">Background</div><h3>Nira and Axel</h3><p><a class=\"wl\" href=\"#nira-dathwen\">Nira</a> knows <a class=\"wl\" href=\"#axel\">Axel</a>'s medical history and that of his not-so-faithful wife. That history now sits alongside a much more immediate grievance: leaving his squad behind.</p></div><div class=\"thread closed\"><div class=\"st\">Handed over</div><h3>The Moff in Rebel hands</h3><p><a class=\"wl\" href=\"#imperial-moff\">The Moff</a> reached the <a class=\"wl\" href=\"#rebel-frigate\">Rebel frigate</a> alive, with a fractured skull and in an induced coma. What the Alliance does with him is no longer the crew's call.</p></div><div class=\"thread open\"><div class=\"st\">Table business</div><h3>A crew with no name</h3><p>The GM wants a crew name. Early ideas: the misfits, the C team, the babysitters. Nothing has stuck yet.</p></div>", "backlinks": ["overview"], "search": "open threads a missing slicer, a stolen datapad, an absent ewok, and a freighter nobody will fix."}, {"id": "session-2", "title": "Session 2 — Babysitting Duty", "group": "Sessions", "type": "doc", "typeLabel": "Session", "layout": "prose", "dek": "A furious handler, a pocketed datapad, and a dead droid factory that wasn't as empty as it looked.", "conf": "", "confLabel": "", "player": "", "aliases": [], "aka": [], "html": "<p>The crew came home with the Moff and without Vega. Their handler was not impressed. Docked pay, no repairs and one missing Ewok later, they were sent to find the slicer who got them onto the Moff's landing pad in the first place.</p><h2>The debrief</h2><p>The <a class=\"wl\" href=\"#mynocks-mullet\">Mynock's Mullet</a> jumped to a <a class=\"wl\" href=\"#rebel-frigate\">Mon Calamari frigate</a> keeping station over an asteroid belt in the Mid Rim. While the others nursed their wounds, <a class=\"wl\" href=\"#nira-dathwen\">Nira</a> found an organ-transport cooler in the medical bay and discovered it was full of ice cream.</p><p>After a long wait at a Kashyyyk-wood briefing table, their semi-regular handler <a class=\"wl\" href=\"#kel-oramm\">Major Kel Oramm</a> arrived with two attendants and asked how it went. <a class=\"wl\" href=\"#kryss-dorn\">Kryss</a> reported the Moff unconscious in the cargo hold and suggested that ship repairs be claimed on Rebel insurance. Oramm asked where <a class=\"wl\" href=\"#vega-squad\">Vega Squad</a> was.</p><p>Nira cited doctor–patient confidentiality, hinted darkly at <a class=\"wl\" href=\"#axel\">Axel</a>'s medical history, and explained that Vega had been sent to B-Site — surely, she reasoned, the reason nobody had told the crew about B-Site was cell security rather than any doubts about their competence. A vein began to pulse on Oramm's forehead. A cleaning droid outside heard the result and fled. Oramm threw a datapad at Nira, who dropped her ice cream, and berated the crew for half an hour: this was not the first time, Vega was the linchpin of many operations, and the crew had been sent to babysit.</p><p>When he asked after <a class=\"wl\" href=\"#imperial-moff\">the Moff</a>, Nira explained that she had improvised a strong narcotic and that he'd had \"a bit of a fall\". An attendant reported a fractured skull. Nira described the resulting induced coma as proactive.</p><p>While Oramm raged, <a class=\"wl\" href=\"#tivik-ordo\">Tivik</a> quietly scooped the thrown datapad off the floor. It turned out to be a sensitive intelligence briefing. Oramm announced that the whole affair would come out of their pay and that there was \"Buckley's chance\" of the ship being repaired at the Rebellion's expense.</p><h2>A new job</h2><p>One of the attendants came back alone, kinder than her superior. Vega Company would surface, she said, but the crew should stop making a habit of leaving them in the lurch. Meanwhile Rebel Intelligence had questions of its own. The contact who arranged the crew's clearance to land at the Moff's pad — supplying the intelligence, the forged credentials and the landing information — had gone silent, and Intelligence was suspicious about how that landing had come about.</p><p>The new mission: go to <a class=\"wl\" href=\"#brentaal-iv\">Brentaal IV</a> and bring in a slicer known as <a class=\"wl\" href=\"#feeler\">Feeler</a>. Intelligence had traced Feeler's last data packet to an installation there.</p><h2>Patching up</h2><p>The trip to the frigate and back allowed everyone to recover from their wounds. Nira, practising medicine in a proper medical bay again, tried to treat Kryss's critical injury but ran out of time. The injury remains on his record, though its effects are gone.</p><p>At the quartermaster's cage, Tivik tried to replenish his explosives. The quartermaster pointed out that Vega would have burned through that much in minutes of practice and named a price of 500 credits. Tivik offered 400. Kryss slammed his pistol on the counter. The quartermaster pushed over a sealed, ready-packed case of grenades and charges, said \"200 credits, and get out of here\", and took Tivik's IOU.</p><p>Oramm's moratorium held. The <a class=\"wl\" href=\"#mynocks-mullet\">Mynock's Mullet</a> left the frigate unrepaired, and without <a class=\"wl\" href=\"#voshkar\">Voshkar</a>. Shortly before departure, the Ewok was pulled aside for random drug and alcohol testing. The crew waited for hours. The Rebels said only that he was \"indisposed\".</p><h2>Brentaal IV</h2><p><a class=\"wl\" href=\"#brentaal-iv\">Brentaal IV</a> is a dense, rainy city world. It is no Coruscant, but buildings crowd every horizon, Imperials are active, and an underworld thrives beneath them. Rebel Intelligence's trace led to <a class=\"wl\" href=\"#droid-factory\">a decrepit warehouse</a> behind fences and open ground. Across the street, a municipal crew was digging up the sewers by night.</p><p>The crew went to find information first. A third-shift bar was full of hi-vis workers. Kryss flicked 100 credits over the bar for three drinks and told the bartender to keep the change. Nira wrote \"we are looking for a person called the Feeler\" on a napkin. The bartender asked whether it was a stripper's name, then explained that a crew had recently been paid big credits to install data cabling in the warehouse across the street, even though it hadn't operated for a couple of cycles. Nira thanked him loudly for directions to the strippers. Kryss led the bar in a drinking song, to Tivik's visible embarrassment.</p><p>Tivik reminded the others to use his mission codename, Jaxon Kel; the slicer community is small.</p><h2>Outside the bar</h2><p>The flashy credstick had attracted attention. Two thugs with death sticks and carbines blocked the way and suggested that the lady hand over her credits. Nira couldn't read their allegiances in the rain, but was fairly sure they were lying about having backup. Kryss offered to buy them a drink instead. It didn't work.</p><p>One thug jammed his carbine against Nira's chest and fired. She batted the barrel aside, and her shock gloves crackled to life. Her vibroscalpel missed, but the thug fell backwards trying to avoid it, and she kicked over a barrel for cover. Kryss quick-drew his pistol and riddled the second thug with autofire, then sidestepped his return fire. Tivik moved to the doorway's flank and hit the first thug with a heavy pistol shot. Neither thug had landed a blow; both ran off into the rain.</p><p>Kryss winged one with a parting rifle shot. The thug dropped a grimy satchel containing a packet of death sticks, 50 credits and a small bag of unidentified white powder.</p><h2>The droid factory</h2><p>Kryss's survey of the warehouse found no cameras, patrols or turrets — just dilapidation and newly installed infrastructure. The crew slipped in behind a sheet of plywood. Inside lay a long-dead droid production line: a tangle of conveyors, dangling armatures, and half-built protocol droids with creepy faces slumped everywhere.</p><p>Kryss stepped on a newly installed pressure plate wired into the building's power. He froze, called for Jaxon and stayed calm enough to expose the wiring back to a control terminal. Tivik sliced it and disarmed the trap without using his demolitions kit. Turning around, he came face to face with a dead droid's dangling head. Nira salvaged a good droid leg, in case Kryss ever needs a prosthetic.</p><p>A gantry led to offices on the upper floor. On the way, Nira triggered a ceiling net made from repurposed cargo mesh, which slammed her to the ground. She began cutting her way out with her vibroscalpel. Tivik noticed a shadow moving. Kryss charged after it, swung at what turned out to be an inert droid, and realised that there were two threats: one on the floor and one up high.</p><h2>Hush and Whisper</h2><p>The crew had been ambushed by two lurker droids, cobbled together from the factory's spare parts. The first scuttled across the floor on all fours towards Kryss. He dived behind a conveyor. Nira, free of the net, hit it with her shock gloves. The second dropped onto the gantry and shot Nira with a suppressed blaster. The first leapt the conveyor and caught Kryss with shock claws, tearing itself up on the machinery in the process.</p><p>Nira took up the salvaged droid leg and swung it like an electrified bat. Tivik threw a frag grenade at the gantry droid, leaving the gantry hanging askew. Kryss put a point-blank stun bolt into the clawed droid, Hush, freezing it mid-lunge with its claw reaching for his throat. The gantry droid dropped to the floor and tried to vanish into the dark, but Tivik pinned it with pistol fire. Kryss switched to his rifle, aimed for a headshot and missed, but hit an electrical panel instead. The arc of current overloaded the droid's head, and Whisper exploded.</p><p>Both droids had their names daubed on their chassis. <a class=\"wl\" href=\"#hush-and-whisper\">Hush</a> survived just long enough for Tivik to slice into it and get three answers before it shut down. Hush and Whisper were built by Feeler. Their master goes by many handles, Feeler being the most common, and had stepped away to attend a function.</p><p>Nira used her medpac on Kryss, stimmed him, and put a lit death stick in his mouth for the pain.</p><h2>Where things stand</h2><ul><li>The warehouse holds enough intelligence to identify Feeler's next move: a function somewhere on Brentaal IV.</li><li>Voshkar is \"indisposed\" somewhere on the Rebel frigate, having an adventure of his own.</li><li>Tivik has Oramm's sensitive briefing datapad. Its contents haven't been revealed.</li><li>The ship remains unrepaired, and the crew's pay is docked.</li><li>Tivik owes the quartermaster 200 credits for a case of grenades and charges.</li><li>Tivik's obligation came up at the end of Session 1 and has not yet bitten. The GM has carried it into Session 3.</li></ul><div class=\"panel note\"><div class=\"ph\">Source and uncertain details</div><p>Based on the Session 2 recording transcript. The spelling of Feeler needs confirmation.</p></div>", "backlinks": ["brentaal-iv", "overview", "feeler", "rebel-alliance"], "search": "session 2 — babysitting duty a furious handler, a pocketed datapad, and a dead droid factory that wasn't as empty as it looked."}, {"id": "session-1", "title": "Session 1 — Medical Professionals Coming Through", "group": "Sessions", "type": "doc", "typeLabel": "Session", "layout": "prose", "dek": "A stolen drinks cabinet, a medical emergency of their own making, and one live Moff in the hold.", "conf": "", "confLabel": "", "player": "", "aliases": [], "aka": [], "html": "<p>The crew were supposed to deliver <a class=\"wl\" href=\"#vega-squad\">Vega Squad</a>, babysit the ship and be ready for extraction. Instead, they left with <a class=\"wl\" href=\"#imperial-moff\">the mission's target</a> alive, a damaged freighter and Vega still on the ground.</p><h2>The support act</h2><p>Using forged access codes and a landing arranged by an unnamed Alliance supporter, <a class=\"wl\" href=\"#kryss-dorn\">Kryss</a> brought the <a class=\"wl\" href=\"#mynocks-mullet\">Mynock's Mullet</a> into a luxury <a class=\"wl\" href=\"#luxury-spaceport\">spaceport</a> on an Imperial jungle world. His inverted approach ended in a neat touchdown and several decidedly unwell Vega operators. <a class=\"wl\" href=\"#axel\">Axel</a> told the crew to stay put, then his squad disappeared through every exit except the obvious one.</p><p><a class=\"wl\" href=\"#voshkar\">Voshkar</a> rigged a log trap that looked more likely to hit the ship than an attacker. Kryss and <a class=\"wl\" href=\"#tivik-ordo\">Tivik</a> broke into the reception area's liquor supply and carried off a case of expensive booze. <a class=\"wl\" href=\"#nira-dathwen\">Nira</a> found a perch above an entrance and settled in to watch.</p><h2>A very convenient emergency</h2><p><a class=\"wl\" href=\"#armand\">Armand</a> arrived with six security droids and wanted an explanation. Kryss tried charm and introduced himself by his real name. Nira followed with a better story: they were a medical extraction team waiting for a casualty, urgently in need of fuel. An expired medical credential and a conveniently timed emergency alert sold the lie.</p><p>There was one problem. They were occupying the Moff's personal landing pad, and he was inbound. Every other berth was full. Armand wanted both the freighter and its crew gone, and the liquor returned.</p><p>Tivik found reports of violence at a nearby educational establishment, apparently where Vega had gone looking for the Moff. The crew decided to reach the target first. While Voshkar distracted Armand with an unsuccessful attempt to steal his pen and a successful bite to the hand, Nira prepared a sedative for the liquor. Propaganda material helped identify the target as a Chandrilan man. They returned the doctored bottles and lifted off; Voshkar's logs tumbled onto the pad behind them.</p><h2>Beneath the luxury</h2><p>Before disconnecting from the port's systems, Tivik noticed repeated orders for enormous quantities of basic food, far beyond anything the reception area could need. With the Moff's Lambda shuttle now occupying their berth, the crew decided to investigate.</p><p>Kryss put the freighter down in a nearby street, crushing a speeder and damaging the left landing-gear assembly. All four entered through the public lobby and took a lift below the polished reception areas. They found military barracks and a sizable Imperial garrison: the Moff's extraction force. The food mystery had a much less profitable answer than they had hoped.</p><p>Tivik stayed behind to rig three charges around the lift access routes. The others went to Docking Bay Four to check on their patient.</p><h2>The bedside manner wears off</h2><p>The sedative had worked. The Moff lay unconscious amid anxious attendants, and Armand was relieved to see the supposed medical team return. Voshkar began dragging the patient by the ankles while Nira insisted on an immediate evacuation. <a class=\"wl\" href=\"#lieutenant-voight\">Voight</a> refused to let them take him. This time, the medical story did not hold.</p><p>Voight opened fire on Kryss. He killed the two stormtroopers guarding the scene, and his shots damaged an electrical panel, temporarily disrupting one group of security droids. Voshkar lunged for Armand and was knocked away with a datapad. Nira answered with a surgical vibroscalpel, badly wounding the deputy inspector and using him as a shield.</p><p>Tivik arrived after finishing the charges and destroyed a group of three droids with a frag grenade. Voshkar's next attack failed to injure Voight, but his filthy distraction left her prone. Kryss damaged the remaining droid group, then took return fire that left him wounded and with scattered senses. Nira's final attack put Armand out of the fight, bleeding heavily; nobody stopped to establish whether he would survive.</p><h2>Site B</h2><p>The charges detonated as the garrison responded. With alarms sounding and Voight and surviving droids still a threat, the crew made a fighting withdrawal. Voshkar hauled the Moff out by a rope around his legs while Kryss covered the retreat. The demolished lift routes bought time, but troops began emerging from other doors.</p><p>Nira called Axel, announced that they had the package and told Vega to use Site B, then ended the transmission amid furious protests. No pickup or alternate rendezvous was agreed. Tivik's vote of no confidence in Kryss's parking put him in the pilot's seat for departure, with Kryss relegated to co-pilot.</p><p>Tivik got the freighter airborne under fire. The crushed speeder remained caught on a landing leg long enough to strike nearby buildings, then fell among pursuing droids. The crew escaped the spaceport with the Moff alive. Vega stayed behind.</p><h2>Where things stand</h2><ul><li>The Moff is aboard; his destination, handover and what to do when he wakes remain unresolved.</li><li>Vega's extraction and the consequences of abandoning <a class=\"wl\" href=\"#axel\">Axel</a> are still open.</li><li>The freighter's damaged landing gear needs attention.</li><li>Kryss was wounded and suffered a critical injury; lasting recovery is not established in the recording. Nira also took blaster fire.</li><li>Armand was left incapacitated and bleeding. Voight and some security droids remained active during the withdrawal.</li></ul><div class=\"panel note\"><div class=\"ph\">Source and uncertain details</div><p>Based on the Session 1 recording transcript, from arrival through departure at approximately 01:48. The planet and spaceport are not clearly named. The Moff's name is unclear; Armand's surname and Lieutenant Voight's spelling need confirmation. Narrative outcomes take precedence over proposed actions and corrected combat bookkeeping.</p></div>", "backlinks": ["feeler", "lieutenant-voight", "galactic-empire", "imperial-moff", "luxury-spaceport", "rebel-alliance", "voshkar"], "search": "session 1 — medical professionals coming through a stolen drinks cabinet, a medical emergency of their own making, and one live moff in the hold."}, {"id": "kryss-dorn", "title": "Kryss Dorn", "group": "Player Characters", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "The marksman. Takes the job, does the job, doesn't ask why.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>A human bounty hunter and assassin from Coruscant: professional, quiet and precise, built around one job — putting a shot exactly where it needs to go, at whatever range the moment calls for. He trusts his rifle more than any client.</p><h2>Kit</h2><p>A DDC MR6 modular rifle that switches between a scoped long rifle and a handier carbine, backed up by an SE-14C blaster pistol. Armoured clothing, sporting macrobinoculars, a spare reload and a pair of stimpacks. Quick on the draw and quick to react.</p><h2>History</h2><ul><li>Has applied to the <a class=\"wl\" href=\"#rebel-alliance\">Alliance</a> three times and been rejected three times. Still thinks he's Tier 1 material.</li><li>Has an open invitation from the <a class=\"wl\" href=\"#galactic-empire\">Empire</a> to join its commando ranks, sitting unanswered in his inbox.</li></ul><p><strong>Obligation:</strong> Betrayal.</p><p><strong>Critical injuries:</strong> Scattered Senses (Session 1). Treated, with no ongoing effect, but it still counts; the next critical injury adds +10.</p><h2>Session 1</h2><p>Piloted the arrival at the <a class=\"wl\" href=\"#luxury-spaceport\">luxury spaceport</a>, then damaged the ship's left landing gear while parking on a speeder in the street. In the firefight he killed two stormtroopers and disrupted security droids, but took blaster wounds and a scattered-senses critical injury. <a class=\"wl\" href=\"#tivik-ordo\">Tivik</a> took over for the escape. No completed treatment of the critical injury is established.</p><h2>Session 2</h2><p>Gave the debrief, reporting the Moff in the hold and proposing that repairs go on Rebel insurance. Nira treated his critical injury on the <a class=\"wl\" href=\"#rebel-frigate\">frigate</a>; it stays on his record, but its effects are gone. He secured Tivik's explosives discount by slamming a pistol on the quartermaster's counter.</p><p>On <a class=\"wl\" href=\"#brentaal-iv\">Brentaal IV</a>, he paid generously at the bar and drove off two thugs with autofire. He froze calmly on a pressure-plate trap in the <a class=\"wl\" href=\"#droid-factory\">droid factory</a> and exposed its wiring for Tivik. Against <a class=\"wl\" href=\"#hush-and-whisper\">Hush and Whisper</a>, he took a shock-claw hit, stunned one droid point-blank and destroyed the other with a rifle shot that overloaded a panel. He came out of the fight heavily wounded and was patched up with a medpac, a stim and a death stick.</p><p><strong>Picked up:</strong> a packet of death sticks, 50 credits and a small bag of unidentified white powder, dropped by a fleeing thug.</p><p><strong>Flag:</strong> wants a long-range assassin's shot — the kind of cinematic sniper moment his rifle was built for.</p>", "backlinks": ["axel", "timeline", "overview", "hush-and-whisper", "lieutenant-voight", "threads", "session-1", "session-2", "droid-factory", "galactic-empire", "mynocks-mullet", "rebel-alliance"], "search": "kryss dorn the marksman. takes the job, does the job, doesn't ask why."}, {"id": "nira-dathwen", "title": "Nira Dath'wen", "group": "Player Characters", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "A calm bedside manner and a sharper set of lies. The hands are steady; the credentials aren't.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<figure class=\"fig\"><img src=\"img/nira-dathwen.jpg\" alt=\"Nira Dath&#x27;wen on the job, shock gloves crackling\" loading=\"lazy\"><figcaption>Nira Dath'wen on the job, shock gloves crackling</figcaption></figure><p>A Bothan doctor and social operator: persuasive first, surgeon second. Nira has real medical training and forged Core Worlds credentials that have since expired, and prefers to leave a room sedated rather than dead when a talked-in job goes wrong.</p><h2>Kit</h2><p>A surgical vibroscalpel, shock gloves and a holdout blaster, all small enough to handle with precision rather than strength. A medpac, five stimpacks and a concealed field surgical kit. Armoured clothing and a comlink. A Bothan's convincing demeanour smooths over the rough edges of a lie.</p><h2>History</h2><ul><li>Banned from practising medicine in the Core Worlds. Word of what happened is spreading.</li><li>The forged medical credentials are expired — a complication waiting for the right scene.</li><li>When she had nothing — no home, no work, no credits — <a class=\"wl\" href=\"#tivik-ordo\">Tivik</a> gave her a job and a place to stay. (Hook from Session 2.)</li><li>Knows everyone's medical history, including that of Axel, leader of <a class=\"wl\" href=\"#vega-squad\">Vega Squad</a>, and his not-so-faithful wife.</li></ul><p><strong>Obligation:</strong> Shame.</p><h2>Session 1</h2><p>Sold <a class=\"wl\" href=\"#armand\">Armand</a> a medical-extraction cover story, prepared the liquor that sedated <a class=\"wl\" href=\"#imperial-moff\">the Moff</a>, and tried to evacuate him under the same pretence. When <a class=\"wl\" href=\"#lieutenant-voight\">Voight</a> refused, Nira fought with a vibroscalpel and left Armand incapacitated and bleeding. Nira also took blaster fire, then told <a class=\"wl\" href=\"#axel\">Axel</a> to use Site B as the crew departed without Vega.</p><h2>Session 2</h2><p>Spent the trip home in the medical bay with an organ cooler full of ice cream. In the debrief, she invoked doctor–patient privilege over <a class=\"wl\" href=\"#vega-squad\">Vega Squad</a>, described the Moff's skull fracture and induced coma as proactive, and absorbed a thrown datapad from <a class=\"wl\" href=\"#kel-oramm\">Major Oramm</a>. The ice cream did not survive.</p><p>On <a class=\"wl\" href=\"#brentaal-iv\">Brentaal IV</a>, she asked around for <a class=\"wl\" href=\"#feeler\">Feeler</a> with a napkin note and covered it with a loud joke about strippers. Outside the bar, she batted a carbine aside at point-blank range. In the <a class=\"wl\" href=\"#droid-factory\">droid factory</a>, she was caught under a ceiling net and cut her way out. She then took a blaster hit from a lurker droid and fought back with shock gloves and a salvaged droid leg used as an electrified bat. Afterwards she treated Kryss.</p><p><strong>Carrying:</strong> a salvaged droid leg — a prosthetic for Kryss, should one be needed.</p><p><strong>Goal:</strong> a long-term grudge against the establishment that drove her out of the Core Worlds.</p>", "backlinks": ["axel", "timeline", "overview", "armand", "lieutenant-voight", "kel-oramm", "threads", "session-1", "session-2", "droid-factory", "imperial-moff", "rebel-frigate", "tivik-ordo", "vega-squad"], "search": "nira dath'wen a calm bedside manner and a sharper set of lies. the hands are steady; the credentials aren't."}, {"id": "tivik-ordo", "title": "Tivik Ordo", "group": "Player Characters", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "The slicer. Would rather not be seen at all.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>A Duros technician and droid tech: slicer, mechanic and demolitions support. A professional who thinks the job is the work, not the spotlight. Like most Duros, he has a feel for astrogation.</p><p>He is not built for sneaking, though — a real gap for a crew that may need to be smuggled in quietly.</p><h2>Kit</h2><p>Slicer gear and a datapad, a demolitions tool kit, three Destro-6 breaching charges and two frag grenades. An IR-5 blaster pistol with a filed front sight. Armoured clothing, a comlink and two stimpacks.</p><h2>History</h2><ul><li>His slicer handle is on both the <a class=\"wl\" href=\"#rebel-alliance\">Alliance</a> and <a class=\"wl\" href=\"#galactic-empire\">Empire</a> watchlists for questionable holonet activity.</li><li>Took in <a class=\"wl\" href=\"#nira-dathwen\">Nira</a> when she had nowhere to go, giving her work and a place to stay. (Hook from Session 2.)</li><li>Is currently blackmailing Alliance and Imperial officials in a concurrent scam. Neither side can find out.</li></ul><p><strong>Obligation:</strong> Blackmail.</p><h2>Session 1</h2><p>Accessed the <a class=\"wl\" href=\"#luxury-spaceport\">luxury spaceport</a>'s systems and discovered the food orders that led the crew to its hidden garrison. Rigged three charges around the lift routes, destroyed three security droids with a grenade, and flew the damaged <a class=\"wl\" href=\"#mynocks-mullet\">Mynock's Mullet</a> out with <a class=\"wl\" href=\"#imperial-moff\">the Moff</a> aboard. The charges detonated during the withdrawal. Explosive supplies need checking before the next job; the final escape narration does not establish a reliable remaining count.</p><h2>Session 2</h2><p>Pocketed the datapad <a class=\"wl\" href=\"#kel-oramm\">Major Oramm</a> threw during the debrief. It is a sensitive intelligence briefing, and its contents are not yet revealed. He haggled with the quartermaster for a ready-packed case of grenades and charges and owes him 200 credits.</p><p>On <a class=\"wl\" href=\"#brentaal-iv\">Brentaal IV</a>, he went by his mission codename, Jaxon Kel. He disarmed a pressure-plate mine by slicing its terminal, spotted the lurker droids first, threw a frag grenade at the gantry and pinned <a class=\"wl\" href=\"#hush-and-whisper\">Whisper</a> with pistol fire. He then sliced Hush and learned that <a class=\"wl\" href=\"#feeler\">Feeler</a> built both droids and had left to attend a function.</p><p>His obligation came up at the end of Session 1 but did not trigger in Session 2. The GM is carrying it into Session 3.</p>", "backlinks": ["timeline", "overview", "hush-and-whisper", "kryss-dorn", "kel-oramm", "nira-dathwen", "threads", "session-1", "session-2", "droid-factory", "galactic-empire", "luxury-spaceport", "rebel-frigate", "mynocks-mullet", "rebel-alliance"], "search": "tivik ordo the slicer. would rather not be seen at all."}, {"id": "voshkar", "title": "Voshkar", "group": "Player Characters", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "The doorway-holder. Stands where the trouble is so nobody else has to.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>An Ewok hired gun and enforcer. Small enough to be underestimated, loud enough to prevent it, and dangerously enthusiastic about traps and close combat. In <a class=\"wl\" href=\"#session-1\">Session 1 — Medical Professionals Coming Through</a>, he spoke Ewok, stole attention more successfully than valuables, and hauled an Imperial Moff out by the ankles.</p><div class=\"panel note\"><div class=\"ph\">Campaign portrayal</div><p>Voshkar was introduced in the original character-sheet summary as a Trandoshan, but was consistently played and described as an Ewok in Session 1. This page follows the portrayal at the table; mechanical character-sheet changes are separate.</p></div><h2>Kit</h2><p>Kyuzo petars, portrayed in Session 1 as savage Ewok claws, and a shield gauntlet that turns him into cover for anyone standing behind him. A heavy blaster pistol for when a punch won't reach. Padded armour, a comlink and two stimpacks.</p><h2>History</h2><ul><li>Runs a personal training and fitness empire whose clients include both the <a class=\"wl\" href=\"#galactic-empire\">Empire</a> and the <a class=\"wl\" href=\"#rebel-alliance\">Alliance</a>.</li><li>Owes favours to a lot of people who helped him build it.</li><li>His face is recognisable in certain circles.</li></ul><p><strong>Obligation:</strong> Favour.</p><h2>Session 1</h2><p>Built an unreliable log trap, bit <a class=\"wl\" href=\"#armand\">Armand</a> while trying to steal his pen, and fought at close quarters during the failed medical extraction. His distraction left <a class=\"wl\" href=\"#lieutenant-voight\">Voight</a> prone. He dragged <a class=\"wl\" href=\"#imperial-moff\">the Moff</a> to the ship during the withdrawal; the prisoner survived.</p><h2>Session 2</h2><p>Pulled aside for random drug and alcohol testing aboard the <a class=\"wl\" href=\"#rebel-frigate\">Rebel frigate</a> just before the crew left for <a class=\"wl\" href=\"#brentaal-iv\">Brentaal IV</a>. The crew waited for hours; the Rebels said only that he was \"indisposed\". He is having an adventure of his own and may turn up mid-mission.</p>", "backlinks": ["timeline", "overview", "armand", "lieutenant-voight", "threads", "session-1", "session-2", "galactic-empire", "imperial-moff", "rebel-frigate", "rebel-alliance"], "search": "voshkar the doorway-holder. stands where the trouble is so nobody else has to."}, {"id": "axel", "title": "Axel", "group": "Allies & Contacts", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "Vega's leader. Used to giving the support crew orders, less used to being left behind.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>The imposing leader of <a class=\"wl\" href=\"#vega-squad\">Vega Squad</a>. He treats the crew of the <a class=\"wl\" href=\"#mynocks-mullet\">Mynock's Mullet</a> as a transport and support detail, keeping them out of much of the briefing and expecting them ready for extraction.</p><p><a class=\"wl\" href=\"#nira-dathwen\">Nira</a> knows his medical history, and that of his not-so-faithful wife.</p><h2>Session 1</h2><p>After <a class=\"wl\" href=\"#kryss-dorn\">Kryss</a>'s exuberant landing, Axel told the crew to stay with the ship while Vega departed on its operation. Later, Nira called to say the crew had <a class=\"wl\" href=\"#imperial-moff\">the target</a> and directed Vega to Site B. Axel's answer was furious. The freighter left without his squad; no subsequent pickup is recorded.</p><h2>Session 2</h2><p>Not seen. <a class=\"wl\" href=\"#nira-dathwen\">Nira</a> hinted at his medical history in front of <a class=\"wl\" href=\"#kel-oramm\">Major Oramm</a>, who was more interested in where Axel's squad had gone.</p>", "backlinks": ["timeline", "nira-dathwen", "threads", "session-1", "session-2", "vega-squad"], "search": "axel vega's leader. used to giving the support crew orders, less used to being left behind."}, {"id": "armand", "title": "Deputy Inspector Armand", "group": "Allies & Contacts", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "Wanted his landing pad cleared and his liquor returned. Had a much worse night.", "conf": "mid", "confLabel": "Needs review", "player": "", "aliases": [], "aka": [], "html": "<p>A meticulously dressed bureaucrat responsible for clearing <a class=\"wl\" href=\"#imperial-moff\">the Moff</a>'s private landing pad at the <a class=\"wl\" href=\"#luxury-spaceport\">luxury spaceport</a>. He carries a datapad, a pistol and a pen that <a class=\"wl\" href=\"#voshkar\">Voshkar</a> badly wanted.</p><h2>Session 1</h2><p>Armand confronted the crew with six security droids. <a class=\"wl\" href=\"#nira-dathwen\">Nira</a> convinced him they were medical responders, but he still required them to move the ship and return the liquor. He accepted the returned case without discovering the sedative.</p><p>When the crew returned to collect the unconscious Moff, Armand initially welcomed their help. The attempted extraction became a firefight. He knocked Voshkar away with his datapad, then was severely wounded by Nira's vibroscalpel. He was left incapacitated and bleeding; his eventual survival is unconfirmed.</p><div class=\"panel note\"><div class=\"ph\">Name needs confirmation</div><p>The recording variously transcribes his surname as Quillerin, Quilleran and Quillerian. This page uses Armand until the spelling is confirmed.</p></div>", "backlinks": ["timeline", "nira-dathwen", "threads", "session-1", "imperial-moff", "luxury-spaceport", "voshkar"], "search": "deputy inspector armand wanted his landing pad cleared and his liquor returned. had a much worse night."}, {"id": "feeler", "title": "Feeler", "group": "Allies & Contacts", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "A slicer with many handles. Got the crew onto the Moff's pad, then went quiet.", "conf": "mid", "confLabel": "Needs review", "player": "", "aliases": ["Fela"], "aka": [], "html": "<p>A slicer who goes by many handles; Feeler is the most common. According to Rebel Intelligence, Feeler's data packet supplied the intelligence, forged credentials and landing information that put the crew on <a class=\"wl\" href=\"#imperial-moff\">the Moff</a>'s private pad in <a class=\"wl\" href=\"#session-1\">Session 1 — Medical Professionals Coming Through</a>. Then Feeler went incommunicado.</p><p>Rebel Intelligence finds the arrangement suspicious and wants Feeler brought in. In <a class=\"wl\" href=\"#session-2\">Session 2 — Babysitting Duty</a>, the crew traced the last data packet to a <a class=\"wl\" href=\"#droid-factory\">derelict droid factory</a> on <a class=\"wl\" href=\"#brentaal-iv\">Brentaal IV</a>. The factory had been rewired with fresh data cabling and guarded by traps and two improvised lurker droids, <a class=\"wl\" href=\"#hush-and-whisper\">Hush and Whisper</a>, both built by Feeler.</p><p>According to Hush, Feeler had stepped away to attend a function. Where and what that function is remains to be found in the factory's intelligence.</p><div class=\"panel note\"><div class=\"ph\">Name needs confirmation</div><p>Consistently \"Feeler\" from the GM. Also transcribed as Fela; the table's joke about \"putting out some feelers\" suggests the spelling is right.</p></div>", "backlinks": ["brentaal-iv", "timeline", "overview", "hush-and-whisper", "kel-oramm", "nira-dathwen", "threads", "session-2", "droid-factory", "luxury-spaceport", "rebel-alliance", "tivik-ordo"], "search": "feeler fela a slicer with many handles. got the crew onto the moff's pad, then went quiet."}, {"id": "hush-and-whisper", "title": "Hush and Whisper", "group": "Allies & Contacts", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "Two lurker droids built from spare parts and left to mind the shop.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": ["Hush", "Whisper"], "html": "<figure class=\"fig\"><img src=\"img/hush-and-whisper.jpg\" alt=\"Lurker droids in the droid factory on Brentaal IV\" loading=\"lazy\"><figcaption>Lurker droids in the droid factory on Brentaal IV</figcaption></figure><p>A pair of lurker droids: ad hoc constructions assembled from parts on the floor of the <a class=\"wl\" href=\"#droid-factory\">droid factory</a> on <a class=\"wl\" href=\"#brentaal-iv\">Brentaal IV</a>. Their names are graffitied on their chassis. One scuttled on all fours with shock claws; the other hid in the rafters with a suppressed light blaster.</p><h2>Session 2</h2><p>They ambushed the crew in the dark. Hush charged <a class=\"wl\" href=\"#kryss-dorn\">Kryss</a> across the factory floor and caught him with its shock claws before he stunned it point-blank, its claw still reaching for his throat. Whisper dropped from the rafters and was pinned by <a class=\"wl\" href=\"#tivik-ordo\">Tivik</a>'s pistol fire. Kryss then hit an electrical panel beside it, overloading it and blowing it apart.</p><p>Hush survived long enough to be interrogated. Tivik sliced into it and got three answers before it shut down for good: <a class=\"wl\" href=\"#feeler\">Feeler</a> built them both; Feeler goes by many handles; and Feeler had stepped away to attend a function.</p>", "backlinks": ["feeler", "kryss-dorn", "threads", "session-2", "droid-factory", "tivik-ordo"], "search": "hush and whisper hush whisper two lurker droids built from spare parts and left to mind the shop."}, {"id": "lieutenant-voight", "title": "Lieutenant Voight", "group": "Allies & Contacts", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "The officer who did not buy the medical evacuation.", "conf": "mid", "confLabel": "Needs review", "player": "", "aliases": [], "aka": [], "html": "<p>A human Imperial lieutenant accompanying <a class=\"wl\" href=\"#imperial-moff\">the Moff</a> at the <a class=\"wl\" href=\"#luxury-spaceport\">luxury spaceport</a> in <a class=\"wl\" href=\"#session-1\">Session 1 — Medical Professionals Coming Through</a>. The transcript most often renders her name as Voight; its spelling remains provisional.</p><p>She refused to let the crew take the unconscious Moff and opened fire when <a class=\"wl\" href=\"#nira-dathwen\">Nira</a>'s deception failed. She concentrated on <a class=\"wl\" href=\"#kryss-dorn\">Kryss</a>, recognising the threat posed by his rifle, and wounded him.</p><p><a class=\"wl\" href=\"#voshkar\">Voshkar</a> knocked her prone through a distraction, but did not defeat her. She was still firing during the crew's withdrawal. Her next move is unknown.</p>", "backlinks": ["timeline", "nira-dathwen", "threads", "session-1", "galactic-empire", "imperial-moff", "voshkar"], "search": "lieutenant voight the officer who did not buy the medical evacuation."}, {"id": "kel-oramm", "title": "Major Kel Oramm", "group": "Allies & Contacts", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "The crew's handler. Has read this report before, and liked it less each time.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Kel Oram", "Kell Oram"], "aka": [], "html": "<p>A Mon Calamari major in Rebel Intelligence and the crew's semi-regular handler. He expects to be called \"sir\" and is hard to read until he isn't.</p><h2>Session 2</h2><p>He debriefed the crew aboard the <a class=\"wl\" href=\"#rebel-frigate\">Mon Calamari frigate</a> after the Moff job. He wanted to know where <a class=\"wl\" href=\"#vega-squad\">Vega Squad</a> was. When <a class=\"wl\" href=\"#nira-dathwen\">Nira</a> explained the B-Site arrangement, he threw a datapad at her and spent half an hour berating the crew. This was not the first time they had left Vega behind.</p><p>He docked their pay and put a moratorium on repairing the <a class=\"wl\" href=\"#mynocks-mullet\">Mynock's Mullet</a> at the Rebellion's expense. He did not notice <a class=\"wl\" href=\"#tivik-ordo\">Tivik</a> pocketing the datapad he had thrown, a sensitive intelligence briefing.</p><p>His attendant later gave the crew their next assignment: bring in the slicer <a class=\"wl\" href=\"#feeler\">Feeler</a> on <a class=\"wl\" href=\"#brentaal-iv\">Brentaal IV</a>.</p>", "backlinks": ["axel", "timeline", "overview", "nira-dathwen", "threads", "session-2", "rebel-frigate", "mynocks-mullet", "rebel-alliance", "tivik-ordo", "vega-squad"], "search": "major kel oramm kel oram kell oram the crew's handler. has read this report before, and liked it less each time."}, {"id": "imperial-moff", "title": "The Imperial Moff", "group": "Allies & Contacts", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "The target came aboard alive. He did not come aboard willingly.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>A Chandrilan Imperial Moff and the target of the operation in <a class=\"wl\" href=\"#session-1\">Session 1 — Medical Professionals Coming Through</a>. His personal name is not clear enough in the recording to establish a canonical spelling.</p><p>He arrived by Lambda shuttle at his private berth in the <a class=\"wl\" href=\"#luxury-spaceport\">luxury spaceport</a>, supported by attendants, <a class=\"wl\" href=\"#lieutenant-voight\">Voight</a>, stormtroopers and a garrison housed beneath the port. <a class=\"wl\" href=\"#armand\">Armand</a> had been preparing the landing pad for him.</p><h2>Capture</h2><p><a class=\"wl\" href=\"#nira-dathwen\">Nira</a> sedated him through doctored liquor, then attempted to remove him under cover of a medical evacuation. When that failed, the crew fought their way out. <a class=\"wl\" href=\"#voshkar\">Voshkar</a> dragged him to the <a class=\"wl\" href=\"#mynocks-mullet\">Mynock's Mullet</a>, and he survived the extraction.</p><p>At the end of Session 1 he was alive aboard the crew's ship.</p><h2>Session 2</h2><p>The crew brought him to the <a class=\"wl\" href=\"#rebel-frigate\">Rebel frigate</a>. Rebel examination found a fractured skull, which <a class=\"wl\" href=\"#nira-dathwen\">Nira</a> attributed to \"a bit of a fall\"; she described the induced coma as proactive. He appears to have passed into Rebel hands, though no formal handover was narrated. What the Alliance intends to do with him is unknown.</p>", "backlinks": ["axel", "timeline", "overview", "armand", "feeler", "lieutenant-voight", "nira-dathwen", "threads", "session-1", "session-2", "galactic-empire", "luxury-spaceport", "mynocks-mullet", "rebel-alliance", "tivik-ordo", "vega-squad", "voshkar"], "search": "the imperial moff the target came aboard alive. he did not come aboard willingly."}, {"id": "brentaal-iv", "title": "Brentaal IV", "group": "Places", "type": "place", "typeLabel": "Place", "layout": "prose", "dek": "Rain, sprawl, shift workers and an underworld that lives in the Empire's shadow.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Brentel IV", "Brentel4", "Brantel for", "Brantow four", "Brandtale four"], "aka": [], "html": "<p>A densely built city world, visited in <a class=\"wl\" href=\"#session-2\">Session 2 — Babysitting Duty</a>. It is nowhere near Coruscant, but its cityscape crowds every horizon. Imperials are active here, and where they go an underbelly follows: plenty of places for slicers to operate.</p><p>Rebel Intelligence traced <a class=\"wl\" href=\"#feeler\">Feeler</a>'s last data packet to a <a class=\"wl\" href=\"#droid-factory\">derelict droid factory</a> here. The nearby bars run on shift work, serving third-, fourth- and fifth-shift crews in hi-vis.</p>", "backlinks": ["timeline", "overview", "feeler", "hush-and-whisper", "kryss-dorn", "kel-oramm", "nira-dathwen", "threads", "session-2", "droid-factory", "mynocks-mullet", "rebel-alliance", "tivik-ordo", "voshkar"], "search": "brentaal iv brentel iv brentel4 brantel for brantow four brandtale four rain, sprawl, shift workers and an underworld that lives in the empire's shadow."}, {"id": "droid-factory", "title": "The Droid Factory", "group": "Places", "type": "place", "typeLabel": "Place", "layout": "prose", "dek": "Dead for cycles from the outside. Freshly wired, trapped and guarded on the inside.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>A decrepit warehouse on <a class=\"wl\" href=\"#brentaal-iv\">Brentaal IV</a>, behind fencing and open ground, across the street from a third-shift bar. It once manufactured droids. The production line is long dead, leaving a nest of conveyors, dangling armatures, spare limbs and half-finished protocol droids.</p><p>It hasn't operated for a couple of cycles, but the bartender across the street said a crew had recently been paid well to install data cabling inside. Rebel Intelligence places <a class=\"wl\" href=\"#feeler\">Feeler</a>'s last transmission here.</p><h2>Defences</h2><p>There are no cameras, patrols or turrets outside; the dilapidation is the camouflage. Inside, <a class=\"wl\" href=\"#kryss-dorn\">Kryss</a> found a pressure plate wired into the building's power, which <a class=\"wl\" href=\"#tivik-ordo\">Tivik</a> disarmed by slicing its control terminal. <a class=\"wl\" href=\"#nira-dathwen\">Nira</a> triggered a ceiling net made from repurposed cargo mesh. Two lurker droids, <a class=\"wl\" href=\"#hush-and-whisper\">Hush and Whisper</a>, ambushed the crew.</p><h2>After the fight</h2><p>A frag grenade left the gantry to the upper-floor offices hanging askew. Whisper was destroyed; Hush shut down after Tivik questioned it. The crew holds the building, and the GM has said it contains enough intelligence to identify Feeler's next move. It's unknown whether the firefight was noticed outside.</p>", "backlinks": ["brentaal-iv", "overview", "feeler", "hush-and-whisper", "kryss-dorn", "nira-dathwen", "threads", "session-2"], "search": "the droid factory dead for cycles from the outside. freshly wired, trapped and guarded on the inside."}, {"id": "luxury-spaceport", "title": "The Luxury Spaceport", "group": "Places", "type": "place", "typeLabel": "Place", "layout": "prose", "dek": "Private berths and a botanical garden above. An Imperial extraction force below.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>A ground-based spaceport on an unnamed Imperial jungle world, visited in <a class=\"wl\" href=\"#session-1\">Session 1 — Medical Professionals Coming Through</a>. Neither the world's name nor the port's proper name is established clearly in the recording.</p><p>The crew's clearance to land here came from <a class=\"wl\" href=\"#feeler\">Feeler</a>, whose data packet supplied the forged credentials and landing information.</p><h2>Layout</h2><p>Around ten to twelve landing pads form a ring around a central botanical garden. The public lobby operates around the clock, with lifts leading to lower levels. Docking Bay Four is <a class=\"wl\" href=\"#imperial-moff\">the Moff</a>'s private berth, with an expensive reception area and liquor supply. <a class=\"wl\" href=\"#armand\">Armand</a> oversees preparations there.</p><h2>Beneath the port</h2><p><a class=\"wl\" href=\"#tivik-ordo\">Tivik</a> noticed repeated orders for unusually large quantities of cheap food. The crew investigated and discovered a sizable military garrison beneath the luxury facilities, assigned to support the Moff's extraction. This explained the supplies; the speculation about smuggling was never confirmed.</p><h2>After the raid</h2><p>Tivik rigged three charges around lift access routes. They detonated when the garrison responded to the firefight, delaying pursuit without sealing every exit. Troops emerged through other doors as the crew fled. The Moff was taken alive, the reception area became a battlefield, and the <a class=\"wl\" href=\"#mynocks-mullet\">Mynock's Mullet</a> escaped from a nearby street after damaging its landing gear on a speeder.</p>", "backlinks": ["timeline", "armand", "kryss-dorn", "lieutenant-voight", "session-1", "galactic-empire", "imperial-moff", "mynocks-mullet", "rebel-alliance", "tivik-ordo", "vega-squad"], "search": "the luxury spaceport private berths and a botanical garden above. an imperial extraction force below."}, {"id": "rebel-frigate", "title": "The Mon Calamari Frigate", "group": "Places", "type": "place", "typeLabel": "Place", "layout": "prose", "dek": "Home port between jobs. Good medbay, grumpy quartermaster, unhappy handler.", "conf": "mid", "confLabel": "Needs review", "player": "", "aliases": [], "aka": [], "html": "<p>A sizeable Mon Calamari frigate of the <a class=\"wl\" href=\"#rebel-alliance\">Alliance</a>, keeping station over a nondescript asteroid belt in the Mid Rim. The crew reports there between missions. Its name hasn't been given.</p><ul><li><strong>Briefing room</strong> — a Kashyyyk-wood table where <a class=\"wl\" href=\"#kel-oramm\">Major Oramm</a> conducts debriefs, at volume.</li><li><strong>Medical bay</strong> — well equipped; the crew recovers here between jobs. <a class=\"wl\" href=\"#nira-dathwen\">Nira</a> found an organ cooler full of ice cream.</li><li><strong>Quartermaster</strong> — a cage behind chain-link fencing with a queue of people waiting for equipment. Gear, including better armour, can be negotiated for here between missions. <a class=\"wl\" href=\"#tivik-ordo\">Tivik</a> owes him 200 credits.</li></ul><h2>Session 2</h2><p>The crew were debriefed after the Moff job, patched up and given their next mission. <a class=\"wl\" href=\"#voshkar\">Voshkar</a> was pulled aside for random drug and alcohol testing before departure and did not leave with them. The <a class=\"wl\" href=\"#mynocks-mullet\">Mynock's Mullet</a> left without the repairs it had requisitioned.</p>", "backlinks": ["timeline", "overview", "kryss-dorn", "kel-oramm", "threads", "session-2", "imperial-moff", "mynocks-mullet", "rebel-alliance", "voshkar"], "search": "the mon calamari frigate home port between jobs. good medbay, grumpy quartermaster, unhappy handler."}, {"id": "mynocks-mullet", "title": "The Mynock's Mullet", "group": "Ships", "type": "ship", "typeLabel": "Ship", "layout": "prose", "dek": "Built to be forgotten the moment it's out of sight.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>The crew's ship: a modified light freighter with battered, mismatched hull plating and a scrubbed registry. It is deliberately nondescript, one of thousands like it in the Outer Rim.</p><p>It carries a single light laser cannon in a turret that covers every arc, crewed from the gunner's position.</p><h2>Session 1</h2><p>Carried <a class=\"wl\" href=\"#vega-squad\">Vega Squad</a> into the <a class=\"wl\" href=\"#luxury-spaceport\">luxury spaceport</a> under forged codes. <a class=\"wl\" href=\"#kryss-dorn\">Kryss</a> later landed it on a speeder in a nearby street, damaging the left landing-gear assembly. <a class=\"wl\" href=\"#tivik-ordo\">Tivik</a> flew the escape with the speeder still caught on a landing leg until it fell away. The crew and <a class=\"wl\" href=\"#imperial-moff\">the captive Moff</a> got out; Vega did not come aboard.</p><h2>Session 2</h2><p><a class=\"wl\" href=\"#kel-oramm\">Major Oramm</a> put a moratorium on repairing it at the Rebellion's expense, so it left the <a class=\"wl\" href=\"#rebel-frigate\">frigate</a> for <a class=\"wl\" href=\"#brentaal-iv\">Brentaal IV</a> with its landing gear still damaged.</p>", "backlinks": ["axel", "timeline", "overview", "kel-oramm", "threads", "session-1", "session-2", "imperial-moff", "luxury-spaceport", "rebel-frigate", "tivik-ordo", "vega-squad"], "search": "the mynock's mullet built to be forgotten the moment it's out of sight."}, {"id": "galactic-empire", "title": "The Galactic Empire", "group": "Factions", "type": "faction", "typeLabel": "Faction", "layout": "prose", "dek": "One side of the war. The crew are tangled up with it anyway.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>In <a class=\"wl\" href=\"#session-1\">Session 1 — Medical Professionals Coming Through</a>, the crew abducted <a class=\"wl\" href=\"#imperial-moff\">an Imperial Moff</a> from the <a class=\"wl\" href=\"#luxury-spaceport\">luxury spaceport</a>, fought his escort and delayed the port's garrison with explosives. <a class=\"wl\" href=\"#lieutenant-voight\">Voight</a> remained active during their escape.</p><p>The crew's older ties to the Empire:</p><ul><li><a class=\"wl\" href=\"#kryss-dorn\">Kryss</a> has an open invitation to join its commando ranks.</li><li><a class=\"wl\" href=\"#voshkar\">Voshkar</a> counts Imperial clients in his training empire.</li><li><a class=\"wl\" href=\"#tivik-ordo\">Tivik</a>'s handle is on an Imperial watchlist, and he is blackmailing Imperial officials.</li></ul>", "backlinks": ["overview", "kryss-dorn", "threads", "tivik-ordo", "voshkar"], "search": "the galactic empire one side of the war. the crew are tangled up with it anyway."}, {"id": "rebel-alliance", "title": "The Rebel Alliance", "group": "Factions", "type": "faction", "typeLabel": "Faction", "layout": "prose", "dek": "The other side of the war. The crew are tangled up with it too.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": ["The Rebels", "The Alliance"], "html": "<p>In <a class=\"wl\" href=\"#session-1\">Session 1 — Medical Professionals Coming Through</a>, a contact — later identified as the slicer <a class=\"wl\" href=\"#feeler\">Feeler</a> — arranged the crew's landing at the <a class=\"wl\" href=\"#luxury-spaceport\">luxury spaceport</a> for the operation against <a class=\"wl\" href=\"#imperial-moff\">the Moff</a>. The crew delivered <a class=\"wl\" href=\"#vega-squad\">Vega Squad</a>, then departed with the target alive and Vega still on the ground. In <a class=\"wl\" href=\"#session-2\">Session 2 — Babysitting Duty</a>, <a class=\"wl\" href=\"#kel-oramm\">Major Kel Oramm</a> of Rebel Intelligence debriefed the crew aboard a <a class=\"wl\" href=\"#rebel-frigate\">Mon Calamari frigate</a>. He docked their pay, refused repairs and sent them to <a class=\"wl\" href=\"#brentaal-iv\">Brentaal IV</a> to bring Feeler in.</p><p>The crew's older ties to the Alliance:</p><ul><li><a class=\"wl\" href=\"#kryss-dorn\">Kryss</a> has applied to join three times and been turned down three times.</li><li><a class=\"wl\" href=\"#voshkar\">Voshkar</a> counts Rebel clients in his training empire.</li><li><a class=\"wl\" href=\"#tivik-ordo\">Tivik</a>'s handle is on an Alliance watchlist, and he is blackmailing Alliance officials.</li></ul>", "backlinks": ["overview", "kryss-dorn", "threads", "rebel-frigate", "tivik-ordo", "voshkar"], "search": "the rebel alliance the rebels the alliance the other side of the war. the crew are tangled up with it too."}, {"id": "vega-squad", "title": "Vega Squad", "group": "Factions", "type": "faction", "typeLabel": "Faction", "layout": "prose", "dek": "The elite operators went after the target. Their support crew got there first.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": ["Vega Company"], "html": "<p>An elite squad led by <a class=\"wl\" href=\"#axel\">Axel</a>, also called Vega Company. The crew of the <a class=\"wl\" href=\"#mynocks-mullet\">Mynock's Mullet</a> serves as its transport and support detail, receives limited briefing and gets little respect in return. <a class=\"wl\" href=\"#nira-dathwen\">Nira</a> knows Axel's medical history and that of his not-so-faithful wife.</p><h2>Session 1</h2><p>Vega disembarked at the <a class=\"wl\" href=\"#luxury-spaceport\">luxury spaceport</a> and headed into the city on an operation targeting <a class=\"wl\" href=\"#imperial-moff\">an Imperial Moff</a>. Reports and visible fires placed their apparent activity at a nearby educational establishment while the Moff arrived at the port instead.</p><p>The crew captured the Moff and left without collecting Vega. Nira told Axel to go to Site B, but no alternate rendezvous or later pickup was agreed. Vega's extraction remains unresolved.</p><h2>Session 2</h2><p>Major <a class=\"wl\" href=\"#kel-oramm\">Oramm</a> was furious to hear Vega had been left behind and told the crew it was not the first time. Rebel command expects Vega Company to \"surface\" on its own. <a class=\"wl\" href=\"#nira-dathwen\">Nira</a> invoked doctor–patient confidentiality and hinted at Axel's medical history.</p>", "backlinks": ["axel", "timeline", "overview", "kel-oramm", "nira-dathwen", "threads", "session-1", "session-2", "mynocks-mullet", "rebel-alliance"], "search": "vega squad vega company the elite operators went after the target. their support crew got there first."}, {"id": "talents", "title": "Talents", "group": "Reference", "type": "doc", "typeLabel": "Session", "layout": "talents", "dek": "Search and filter the full talent catalogue by tier, activation, ranked status and Force.", "conf": "", "confLabel": "", "player": "", "aliases": [], "aka": [], "html": "<p>The catalogue is the campaign's Genesys talent list, revised on 18 October 2026 for Star Wars play:</p><ul><li><strong>Magic is out.</strong> 47 spell-casting and other magic talents from the fantasy Genesys settings have been removed.</li><li><strong>The Force is in.</strong> 125 Force talents from <em>Star Wars Genesys</em> (DrainSmith) have been added: the Force power trees (Bind, Enhance, Force Leap, Heal/Harm, Influence, Misdirect, Move, Protect/Unleash and Sense), the lightsaber forms, and Force Sensitive and Force Rating. A <strong>Force</strong> badge marks them. Only a Force Sensitive character can buy a Force talent.</li><li><strong>More Star Wars talents.</strong> 33 other Star Wars talents are new too, covering droids, jetpacks, stims, clones and lightsaber combat.</li><li><strong>Reflect has two versions.</strong> <em>Reflect</em> is the shield or melee-weapon talent. <em>Reflect (Lightsaber)</em> is the lightsaber one. Each card says which it is.</li></ul><p>Talents cost tier × 5 XP whichever version or source they come from. Rules text uses the narrative-dice symbols; open <strong>Symbol key</strong> below for what each one means. Use the controls to narrow the list. Ordinary text search also matches rules text, notes and source abbreviations.</p>", "backlinks": [], "search": "talents search and filter the full talent catalogue by tier, activation, ranked status and force."}];
const TITLES = {"armand": "Deputy Inspector Armand", "axel": "Axel", "brentaal-iv": "Brentaal IV", "droid-factory": "The Droid Factory", "feeler": "Feeler", "galactic-empire": "The Galactic Empire", "hush-and-whisper": "Hush and Whisper", "imperial-moff": "The Imperial Moff", "kel-oramm": "Major Kel Oramm", "kryss-dorn": "Kryss Dorn", "lieutenant-voight": "Lieutenant Voight", "luxury-spaceport": "The Luxury Spaceport", "mynocks-mullet": "The Mynock's Mullet", "nira-dathwen": "Nira Dath'wen", "overview": "Deniable Assets", "rebel-alliance": "The Rebel Alliance", "rebel-frigate": "The Mon Calamari Frigate", "session-1": "Session 1 — Medical Professionals Coming Through", "session-2": "Session 2 — Babysitting Duty", "talents": "Talents", "threads": "Open Threads", "timeline": "Campaign Timeline", "tivik-ordo": "Tivik Ordo", "vega-squad": "Vega Squad", "voshkar": "Voshkar"};
