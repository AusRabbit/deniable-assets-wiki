<style>
  :root{
    --bg:#EDEFF2; --surface:#FFFFFF; --surface-2:#F5F7F9;
    --ink:#191D23; --muted:#59636F; --line:#D6DBE1;
    --amber:#A66A12; --amber-soft:#F0E2CA;
    --teal:#1B6B67; --teal-soft:#D9EAE8;
    --rust:#9C3B2E; --rust-soft:#F2DFDB;
    --display:"Zilla Slab",Georgia,serif;
    --body:"Source Sans 3",system-ui,-apple-system,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sp:clamp(16px,3vw,28px);
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#13161A; --surface:#1B1F25; --surface-2:#22272E;
      --ink:#E4E8ED; --muted:#939DA9; --line:#2E353E;
      --amber:#DFA244; --amber-soft:#3A2F1C;
      --teal:#56B4AD; --teal-soft:#16302F;
      --rust:#D4776A; --rust-soft:#3A221E;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#13161A; --surface:#1B1F25; --surface-2:#22272E;
    --ink:#E4E8ED; --muted:#939DA9; --line:#2E353E;
    --amber:#DFA244; --amber-soft:#3A2F1C;
    --teal:#56B4AD; --teal-soft:#16302F;
    --rust:#D4776A; --rust-soft:#3A221E;
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--body); font-size:16px; line-height:1.6;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  img{max-width:100%}
  a{color:inherit}
  h1,h2,h3{font-family:var(--display); text-wrap:balance; margin:0; font-weight:600}
  code{font-family:var(--mono); font-size:.92em; background:var(--surface-2); padding:1px 5px; border-radius:3px}

  .shell{display:grid; grid-template-columns:270px minmax(0,1fr)}
  @media (max-width:820px){ .shell{grid-template-columns:minmax(0,1fr)} }

  .rail{
    border-right:1px solid var(--line); background:var(--surface);
    padding:var(--sp) 0 48px; position:sticky; top:env(safe-area-inset-top,0px);
    align-self:start; min-height:100vh; max-height:100vh; overflow-y:auto;
  }
  @media (max-width:820px){
    .rail{position:static; min-height:0; max-height:none; border-right:0; border-bottom:1px solid var(--line); padding-bottom:20px}
  }
  .brand{padding:0 20px 18px; border-bottom:1px solid var(--line); margin-bottom:14px}
  .brand .ship{font-family:var(--display); font-size:21px; font-weight:700; line-height:1.15; letter-spacing:-.01em}
  .brand .sub{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-top:7px}

  .search{margin:0 20px 16px}
  .search input{
    width:100%; padding:8px 11px; border-radius:7px; font-family:var(--body); font-size:14px;
    border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
  }
  .search input:focus{outline:2px solid var(--amber); outline-offset:1px}

  .grp{margin-bottom:16px}
  .grp > .lbl{font-family:var(--mono); font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); padding:0 20px; margin-bottom:5px}
  .nav a{display:flex; align-items:baseline; gap:8px; justify-content:space-between; padding:5px 20px; text-decoration:none; font-size:14.5px; border-left:2px solid transparent}
  .nav a:hover{background:var(--surface-2)}
  .nav a[aria-current="page"]{border-left-color:var(--amber); background:var(--surface-2); font-weight:600}
  .nav a:focus-visible{outline:2px solid var(--amber); outline-offset:-2px}
  .nav a .n{font-family:var(--mono); font-size:10.5px; color:var(--muted)}

  main{padding:var(--sp); padding-block:calc(var(--sp) + 6px) 90px; max-width:820px}
  .crumb{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:10px}
  .ttl{font-size:clamp(28px,5vw,40px); line-height:1.08; letter-spacing:-.02em; margin-bottom:6px}
  .dek{color:var(--muted); font-size:17px; margin-bottom:22px}

  .badges{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:20px}
  .tag{font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; padding:3px 8px; border-radius:4px; background:var(--surface-2); color:var(--muted); border:1px solid var(--line)}
  .tag.t-character{background:var(--teal-soft); color:var(--teal); border-color:transparent}
  .tag.t-place{background:var(--amber-soft); color:var(--amber); border-color:transparent}
  .tag.t-ship{background:var(--amber-soft); color:var(--amber); border-color:transparent}
  .tag.t-faction{background:var(--rust-soft); color:var(--rust); border-color:transparent}
  .conf{display:inline-flex; align-items:center; gap:5px}
  .dot{width:7px; height:7px; border-radius:50%; display:inline-block}
  .dot.hi{background:var(--teal)} .dot.mid{background:var(--amber)} .dot.lo{background:var(--rust)}

  .prose p{margin:0 0 15px}
  .prose h2{font-size:15px; letter-spacing:.02em; margin:30px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--line)}
  .prose ul{margin:0 0 16px; padding-left:20px}
  .prose li{margin-bottom:7px}
  .prose em{color:var(--muted)}

  a.wl{color:var(--teal); text-decoration:none; border-bottom:1px solid color-mix(in srgb, var(--teal) 35%, transparent); padding-bottom:.5px}
  a.wl:hover{border-bottom-color:var(--teal); background:var(--teal-soft)}
  a.wl.missing{color:var(--rust); border-bottom-style:dotted; border-bottom-color:var(--rust)}

  .panel{border:1px solid var(--line); border-radius:9px; background:var(--surface); padding:16px 18px; margin:0 0 18px}
  .panel .ph{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:9px}
  .panel p{margin:0}
  .panel.note{background:var(--surface-2)}
  .panel.warn{border-left:3px solid var(--rust)}

  .alias{display:inline-block; font-family:var(--mono); font-size:11.5px; padding:2px 7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); margin:0 4px 4px 0; color:var(--muted)}

  .backlinks{margin-top:34px; padding-top:16px; border-top:1px solid var(--line)}
  .backlinks .ph{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:8px}
  .backlinks ul{list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:6px}
  .backlinks li a{font-size:13.5px; text-decoration:none; padding:3px 9px; border-radius:5px; background:var(--surface-2); border:1px solid var(--line)}
  .backlinks li a:hover{border-color:var(--teal); color:var(--teal)}

  .thread{border-left:2px solid var(--line); padding:0 0 2px 15px; margin-bottom:20px}
  .thread.open{border-left-color:var(--amber)}
  .thread.hot{border-left-color:var(--rust)}
  .thread h3{font-size:16.5px; margin-bottom:3px}
  .thread .st{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:5px}
  .thread p{margin:0; font-size:15px}

  .beat{display:grid; grid-template-columns:70px minmax(0,1fr); gap:14px; margin-bottom:16px}
  @media (max-width:520px){ .beat{grid-template-columns:minmax(0,1fr); gap:2px} }
  .beat .t{font-family:var(--mono); font-size:11.5px; color:var(--muted); padding-top:4px}
  .beat .b p{margin:2px 0 0; font-size:14.5px; color:var(--muted)}

  .foot{margin-top:44px; padding-top:16px; border-top:1px solid var(--line); font-size:13px; color:var(--muted)}

  .themebtn{
    position:fixed; right:14px; bottom:calc(14px + env(safe-area-inset-bottom,0px));
    border:1px solid var(--line); background:var(--surface); color:var(--muted);
    font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
    padding:7px 11px; border-radius:6px; cursor:pointer;
  }
  .themebtn:hover{color:var(--ink); border-color:var(--amber)}
  @media (prefers-reduced-motion:no-preference){ .nav a,a.wl,.backlinks li a{transition:background .12s,color .12s,border-color .12s} }
</style>
</head>

<script>
const PAGES  = [{"id": "overview", "title": "Deniable Assets", "group": "Campaign", "type": "doc", "typeLabel": "Session", "dek": "Four professionals, one forgettable freighter, and a job nobody has named yet.", "conf": "", "confLabel": "", "player": "", "aliases": [], "aka": [], "html": "<p>A new Star Wars campaign. Nothing has happened yet: the four operatives haven't met the story, and they may not have met each other. Who hires them, what the job is and how they end up in the same room are all for Session 1 to decide.</p><p>What they do have is a skill set that adds up to a crew, a ship built to be forgotten, and a lot of history with both sides of the war.</p><h2>The Crew</h2><ul><li><a class=\"wl\" href=\"#kryss-dorn\">Kryss</a> — Human bounty hunter and assassin. The marksman.</li><li><a class=\"wl\" href=\"#voshkar\">Voshkar</a> — Trandoshan enforcer. The one who stands in the doorway.</li><li><a class=\"wl\" href=\"#nira-dathwen\">Nira</a> — Bothan doctor and social operator, with credentials that expired a while ago.</li><li><a class=\"wl\" href=\"#tivik-ordo\">Tivik</a> — Duros slicer and demolitions tech, wanted by both sides for his holonet habits.</li></ul><h2>The Ship</h2><p>The <a class=\"wl\" href=\"#mynocks-mullet\">Mynock's Mullet</a>, a battered light freighter with mismatched plating and a scrubbed registry — one of thousands like it in the Outer Rim.</p><h2>Both Sides of the War</h2><p>Every member of the crew is tangled up with both the <a class=\"wl\" href=\"#galactic-empire\">Empire</a> and the <a class=\"wl\" href=\"#rebel-alliance\">Alliance</a>. <a class=\"wl\" href=\"#kryss-dorn\">Kryss</a> keeps applying to the Rebels and keeps getting an Imperial offer instead. <a class=\"wl\" href=\"#voshkar\">Voshkar</a> trains clients from both. <a class=\"wl\" href=\"#tivik-ordo\">Tivik</a> is on both sides' watchlists and is blackmailing officials in each. <a class=\"wl\" href=\"#nira-dathwen\">Nira</a> can no longer practise in the Core Worlds at all. See <a class=\"wl\" href=\"#threads\">Open Threads</a>.</p><h2>How We Play</h2><ul><li>Players roll all of their own characters' checks. The GM rolls NPC checks openly and never rolls for a player character.</li><li>The difficulty of a check is stated before you roll, and it depends on the actual stakes rather than a fixed default.</li><li>Declare what you want to do in your own words. There's no numbered menu of options.</li><li>Initiative slots aren't assigned to specific characters; anyone eligible on that side can take one.</li></ul>", "backlinks": [], "search": "deniable assets four professionals, one forgettable freighter, and a job nobody has named yet."}, {"id": "timeline", "title": "Campaign Timeline", "group": "Campaign", "type": "doc", "typeLabel": "Session", "dek": "Every beat in order, once there are beats to record.", "conf": "", "confLabel": "", "player": "", "aliases": [], "aka": [], "html": "<div class=\"beat\"><div class=\"t\">—</div><div class=\"b\"><strong>Awaiting Session 1</strong><p>No sessions have been played. The first beats will appear here after Session 1.</p></div></div>", "backlinks": [], "search": "campaign timeline every beat in order, once there are beats to record."}, {"id": "threads", "title": "Open Threads", "group": "Campaign", "type": "doc", "typeLabel": "Session", "dek": "What the campaign is holding unresolved — before a single roll.", "conf": "", "confLabel": "", "player": "", "aliases": [], "aka": [], "html": "<div class=\"thread hot\"><div class=\"st\">Session 1</div><h3>The job</h3><p>Who brought these four together, and what they've been hired to do, will be established at the start of Session 1.</p></div><div class=\"thread open\"><div class=\"st\">Betrayal</div><h3>Kryss and the Empire</h3><p>Three applications to the <a class=\"wl\" href=\"#rebel-alliance\">Alliance</a>, three rejections. Meanwhile an offer from the <a class=\"wl\" href=\"#galactic-empire\">Empire</a> to join its commando ranks sits in <a class=\"wl\" href=\"#kryss-dorn\">Kryss</a>'s inbox, unanswered.</p></div><div class=\"thread open\"><div class=\"st\">Favour</div><h3>Voshkar's favours</h3><p><a class=\"wl\" href=\"#voshkar\">Voshkar</a>'s fitness empire was built with a lot of help, and he owes favours to a lot of people — on both sides of the war.</p></div><div class=\"thread open\"><div class=\"st\">Shame</div><h3>Nira's past</h3><p><a class=\"wl\" href=\"#nira-dathwen\">Nira</a> has been banned from practising medicine in the Core Worlds, and word of what happened is spreading. The forged credentials are expired.</p></div><div class=\"thread open\"><div class=\"st\">Blackmail</div><h3>Tivik's scam</h3><p><a class=\"wl\" href=\"#tivik-ordo\">Tivik</a> is blackmailing officials in both the <a class=\"wl\" href=\"#rebel-alliance\">Alliance</a> and the <a class=\"wl\" href=\"#galactic-empire\">Empire</a> at the same time, while his slicer handle sits on both sides' watchlists. Neither can be allowed to find out.</p></div><div class=\"thread open\"><div class=\"st\">Background</div><h3>Vega Squad</h3><p><a class=\"wl\" href=\"#nira-dathwen\">Nira</a> knows the medical history of <a class=\"wl\" href=\"#vega-squad\">Vega Squad</a>'s leader, Axel — and of his not-so-faithful wife.</p></div>", "backlinks": ["overview"], "search": "open threads what the campaign is holding unresolved — before a single roll."}, {"id": "kryss-dorn", "title": "Kryss Dorn", "group": "Player Characters", "type": "character", "typeLabel": "Character", "dek": "The marksman. Takes the job, does the job, doesn't ask why.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>A human bounty hunter and assassin: professional, quiet and precise, built around one job — putting a shot exactly where it needs to go, at whatever range the moment calls for. He trusts his rifle more than any client.</p><h2>Kit</h2><p>A DDC MR6 modular rifle that switches between a scoped long rifle and a handier carbine, backed up by an SE-14C blaster pistol. Armoured clothing, sporting macrobinoculars, a spare reload and a pair of stimpacks. Quick on the draw and quick to react.</p><h2>History</h2><ul><li>Has applied to the <a class=\"wl\" href=\"#rebel-alliance\">Alliance</a> three times and been rejected three times. Still thinks he's Tier 1 material.</li><li>Has an open invitation from the <a class=\"wl\" href=\"#galactic-empire\">Empire</a> to join its commando ranks, sitting unanswered in his inbox.</li></ul><p><strong>Obligation:</strong> Betrayal.</p>", "backlinks": ["overview", "threads", "galactic-empire", "rebel-alliance"], "search": "kryss dorn the marksman. takes the job, does the job, doesn't ask why."}, {"id": "nira-dathwen", "title": "Nira Dath'wen", "group": "Player Characters", "type": "character", "typeLabel": "Character", "dek": "A calm bedside manner and a sharper set of lies. The hands are steady; the credentials aren't.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>A Bothan doctor and social operator: persuasive first, surgeon second. Nira has real medical training and forged Core Worlds credentials that have since expired, and prefers to leave a room sedated rather than dead when a talked-in job goes wrong.</p><h2>Kit</h2><p>A surgical vibroscalpel, shock gloves and a holdout blaster, all small enough to handle with precision rather than strength. A medpac, five stimpacks and a concealed field surgical kit. Armoured clothing and a comlink. A Bothan's convincing demeanour smooths over the rough edges of a lie.</p><h2>History</h2><ul><li>Banned from practising medicine in the Core Worlds. Word of what happened is spreading.</li><li>The forged medical credentials are expired — a complication waiting for the right scene.</li><li>Knows everyone's medical history, including that of Axel, leader of <a class=\"wl\" href=\"#vega-squad\">Vega Squad</a>, and his not-so-faithful wife.</li></ul><p><strong>Obligation:</strong> Shame.</p>", "backlinks": ["overview", "threads", "vega-squad"], "search": "nira dath'wen a calm bedside manner and a sharper set of lies. the hands are steady; the credentials aren't."}, {"id": "tivik-ordo", "title": "Tivik Ordo", "group": "Player Characters", "type": "character", "typeLabel": "Character", "dek": "The slicer. Would rather not be seen at all.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>A Duros technician and droid tech: slicer, mechanic and demolitions support. A professional who thinks the job is the work, not the spotlight. Like most Duros, he has a feel for astrogation.</p><p>He is not built for sneaking, though — a real gap for a crew that may need to be smuggled in quietly.</p><h2>Kit</h2><p>Slicer gear and a datapad, a demolitions tool kit, three Destro-6 breaching charges and two frag grenades. An IR-5 blaster pistol with a filed front sight. Armoured clothing, a comlink and two stimpacks.</p><h2>History</h2><ul><li>His slicer handle is on both the <a class=\"wl\" href=\"#rebel-alliance\">Alliance</a> and <a class=\"wl\" href=\"#galactic-empire\">Empire</a> watchlists for questionable holonet activity.</li><li>Is currently blackmailing Alliance and Imperial officials in a concurrent scam. Neither side can find out.</li></ul><p><strong>Obligation:</strong> Blackmail.</p>", "backlinks": ["overview", "threads", "galactic-empire", "rebel-alliance"], "search": "tivik ordo the slicer. would rather not be seen at all."}, {"id": "voshkar", "title": "Voshkar", "group": "Player Characters", "type": "character", "typeLabel": "Character", "dek": "The doorway-holder. Stands where the trouble is so nobody else has to.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>A Trandoshan hired gun and enforcer. Paid muscle who takes the job seriously, built to plant himself in a doorway and not move. Trandoshan claws and regeneration come as standard.</p><h2>Kit</h2><p>Kyuzo petars for punching through armour, and a shield gauntlet that turns him into cover for anyone standing behind him. A heavy blaster pistol for when a punch won't reach. Padded armour, a comlink and two stimpacks.</p><h2>History</h2><ul><li>Runs a personal training and fitness empire whose clients include both the <a class=\"wl\" href=\"#galactic-empire\">Empire</a> and the <a class=\"wl\" href=\"#rebel-alliance\">Alliance</a>.</li><li>Owes favours to a lot of people who helped him build it.</li><li>His face is recognisable in certain circles.</li></ul><p><strong>Obligation:</strong> Favour.</p>", "backlinks": ["overview", "threads", "galactic-empire", "rebel-alliance"], "search": "voshkar the doorway-holder. stands where the trouble is so nobody else has to."}, {"id": "mynocks-mullet", "title": "The Mynock's Mullet", "group": "Ships", "type": "ship", "typeLabel": "Ship", "dek": "Built to be forgotten the moment it's out of sight.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>The crew's ship: a modified light freighter with battered, mismatched hull plating and a scrubbed registry. It is deliberately nondescript, one of thousands like it in the Outer Rim.</p><p>It carries a single light laser cannon in a turret that covers every arc, crewed from the gunner's position.</p>", "backlinks": ["overview"], "search": "the mynock's mullet built to be forgotten the moment it's out of sight."}, {"id": "galactic-empire", "title": "The Galactic Empire", "group": "Factions", "type": "faction", "typeLabel": "Faction", "dek": "One side of the war. The crew are tangled up with it anyway.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>The crew's ties to the Empire so far:</p><ul><li><a class=\"wl\" href=\"#kryss-dorn\">Kryss</a> has an open invitation to join its commando ranks.</li><li><a class=\"wl\" href=\"#voshkar\">Voshkar</a> counts Imperial clients in his training empire.</li><li><a class=\"wl\" href=\"#tivik-ordo\">Tivik</a>'s handle is on an Imperial watchlist, and he is blackmailing Imperial officials.</li></ul>", "backlinks": ["overview", "kryss-dorn", "threads", "tivik-ordo", "voshkar"], "search": "the galactic empire one side of the war. the crew are tangled up with it anyway."}, {"id": "rebel-alliance", "title": "The Rebel Alliance", "group": "Factions", "type": "faction", "typeLabel": "Faction", "dek": "The other side of the war. The crew are tangled up with it too.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": ["The Rebels", "The Alliance"], "html": "<p>The crew's ties to the Alliance so far:</p><ul><li><a class=\"wl\" href=\"#kryss-dorn\">Kryss</a> has applied to join three times and been turned down three times.</li><li><a class=\"wl\" href=\"#voshkar\">Voshkar</a> counts Rebel clients in his training empire.</li><li><a class=\"wl\" href=\"#tivik-ordo\">Tivik</a>'s handle is on an Alliance watchlist, and he is blackmailing Alliance officials.</li></ul>", "backlinks": ["overview", "kryss-dorn", "threads", "tivik-ordo", "voshkar"], "search": "the rebel alliance the rebels the alliance the other side of the war. the crew are tangled up with it too."}, {"id": "vega-squad", "title": "Vega Squad", "group": "Factions", "type": "faction", "typeLabel": "Faction", "dek": "A squad whose leader's medical history Nira knows a little too well.", "conf": "mid", "confLabel": "Needs review", "player": "", "aliases": [], "aka": [], "html": "<p>A squad led by a man named Axel. <a class=\"wl\" href=\"#nira-dathwen\">Nira</a> knows his medical history — and that of his not-so-faithful wife.</p><p>That is everything on record so far.</p>", "backlinks": ["nira-dathwen", "threads"], "search": "vega squad a squad whose leader's medical history nira knows a little too well."}];

const q    = document.getElementById("q");

function renderPage(id){
  const p = byId[id];
  if(!p) return "<p>Page not found.</p>";
  let h = '<div class="crumb">' + p.group + '</div>';
  h += '<h1 class="ttl">' + p.title + '</h1>';
  if(p.dek) h += '<div class="dek">' + p.dek + '</div>';

  if(p.type !== "doc"){
    h += '<div class="badges"><span class="tag t-' + p.type + '">' + p.typeLabel + '</span>';
    if(p.player) h += '<span class="tag">Played by ' + p.player + '</span>';
    if(p.conf)   h += '<span class="tag"><span class="conf"><span class="dot ' + p.conf + '"></span>' + p.confLabel + '</span></span>';
    h += '</div>';
    if(p.aka && p.aka.length){
      h += '<div class="panel"><div class="ph">Also known as</div><div>'
         + p.aka.map(a => '<span class="alias">' + a + '</span>').join('')
         + '</div></div>';
    }
    if(p.aliases.length){
      h += '<div class="panel"><div class="ph">Also transcribed as</div><div>'
         + p.aliases.map(a => '<span class="alias">' + a + '</span>').join('')
         + '</div></div>';
    }
  }

  h += '<div class="prose">' + p.html + '</div>';

  if(p.backlinks.length){
    h += '<div class="backlinks"><div class="ph">Mentioned in</div><ul>'
       + p.backlinks.map(b => '<li><a href="#' + b + '">' + TITLES[b] + '</a></li>').join('')
       + '</ul></div>';
  }

  h += '<div class="foot">' + SOURCE_NOTE + ' Built ' + BUILT + '.</div>';
  return h;
}

function renderNav(filter){
  const f = (filter || "").trim().toLowerCase();
  const groups = [];
  PAGES.forEach(p => {
    if(f && p.search.indexOf(f) === -1) return;
    let g = groups.find(x => x.name === p.group);
    if(!g){ g = {name:p.group, items:[]}; groups.push(g); }
    g.items.push(p);
  });
  if(!groups.length) return '<div style="padding:4px 20px;color:var(--muted);font-size:14px">Nothing matches.</div>';
  return groups.map(g =>
    '<div class="grp"><div class="lbl">' + g.name + '</div>'
    + g.items.map(p =>
        '<a href="#' + p.id + '"' + (p.id === current ? ' aria-current="page"' : '') + '>'
        + '<span>' + p.title + '</span>'
        + (p.type !== "doc" && p.backlinks.length ? '<span class="n">' + p.backlinks.length + '</span>' : '')
        + '</a>').join('')
    + '</div>').join('');
}

function route(){
  const id = decodeURIComponent(location.hash.slice(1));
  current = byId[id] ? id : (PAGES.length ? PAGES[0].id : "");
  main.innerHTML = renderPage(current);
  nav.innerHTML = renderNav(q.value);
  document.title = (byId[current] ? byId[current].title + " · " : "") + CAMPAIGN;
  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", route);
q.addEventListener("input", function(){ nav.innerHTML = renderNav(q.value); });

document.getElementById("themebtn").addEventListener("click", function(){
  const root = document.documentElement;
  const now = root.getAttribute("data-theme");
  const dark = now ? now === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  root.setAttribute("data-theme", dark ? "light" : "dark");
  try { localStorage.setItem("wd-theme", dark ? "light" : "dark"); } catch(e){}
});
try {
  const saved = localStorage.getItem("wd-theme");
  if(saved) document.documentElement.setAttribute("data-theme", saved);
} catch(e){}

route();
</script>
</body>
</html>
